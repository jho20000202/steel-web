<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>報表匯出</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="mobile.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        body {
            padding: 20px;
            background: #0f1320;
            color: #fff;
            font-family: sans-serif;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-title {
            font-size: 24px;
            font-weight: bold;
        }

        .back-btn {
            padding: 10px 20px;
            background: #2f3340;
            color: #fff;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: #3e4452;
        }

        .filter-section {
            background: #1c2433;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 13px;
            color: #aaa;
        }

        .input-box,
        select {
            padding: 12px;
            border-radius: 10px;
            background: #2a2b31;
            border: 1px solid #3e414b;
            color: #fff;
            font-size: 15px;
            min-width: 150px;
        }

        .input-box:focus,
        select:focus {
            outline: none;
            border-color: #3d7bff;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            border: none;
            font-weight: 600;
            color: #fff;
            transition: background 0.2s;
        }

        .btn-primary {
            background: #3d7bff;
        }

        .btn-primary:hover {
            background: #2a65e6;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-info {
            background: #17a2b8;
        }

        .btn-info:hover {
            background: #138496;
        }

        .table-container {
            overflow-x: auto;
            background: #1c2433;
            border-radius: 16px;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #2f3340;
        }

        th {
            color: #aaa;
            font-weight: 600;
            font-size: 14px;
        }

        td {
            color: #eee;
            font-size: 15px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-planned {
            background: #007bff;
            color: #fff;
        }

        .status-received {
            background: #28a745;
            color: #fff;
        }

        .status-lifted {
            background: #6f42c1;
            color: #fff;
        }

        .status-none {
            background: #6c757d;
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="header-row">
        <div class="header-title">報表匯出</div>
        <a href="SteelMaterial.html" class="back-btn">返回主畫面</a>
    </div>

    <div class="filter-section">
        <div class="input-group">
            <label>報表類型</label>
            <select id="reportType">
                <option value="all">完整構件資料</option>
                <option value="received_today">本日進料內容</option>
                <option value="lifted_today">本日吊裝內容</option>
            </select>
        </div>
        <div class="input-group">
            <label>開始日期</label>
            <input type="date" id="startDate" class="input-box">
        </div>
        <div class="input-group">
            <label>結束日期</label>
            <input type="date" id="endDate" class="input-box">
        </div>
        <button class="btn btn-primary" onclick="generateReport()">查詢預覽</button>
        <div style="flex: 1;"></div>
        <button class="btn btn-success" onclick="exportExcel()">匯出 Excel</button>
        <button class="btn btn-info" onclick="exportCSV()">匯出 CSV</button>
    </div>

    <div class="table-container">
        <div id="loading" style="display: none; text-align: center; padding: 20px; color: #aaa;">載入中...</div>
        <table id="reportTable">
            <thead>
                <tr id="tableHeader">
                    <!-- Headers will be injected here -->
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data will be injected here -->
            </tbody>
        </table>
        <div id="noData" style="display: none; text-align: center; padding: 20px; color: #aaa;">無符合資料</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <script src="back.js"></script>
    <script>
        const db = window.supabaseClient;
        let currentData = [];

        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            document.getElementById('startDate').valueAsDate = today;
            document.getElementById('endDate').valueAsDate = today;
        });

        async function generateReport() {
            const type = document.getElementById('reportType').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            if (!startDate || !endDate) {
                alert('請選擇開始日期和結束日期');
                return;
            }

            if (startDate > endDate) {
                alert('開始日期不能晚於結束日期');
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('tableBody').innerHTML = '';
            document.getElementById('noData').style.display = 'none';

            try {
                // Fetch components library for weight lookup
                const { data: components, error } = await db.from('components').select('item_id, position, weight');
                if (error) throw error;
                const weightMap = new Map(components.map(c => [`${c.item_id}|${c.position}`, c.weight]));

                let data = [];
                let headers = [];

                if (type === 'all') {
                    headers = ['構件編號', '位置', '規格', '重量', '狀態', '預計日期', '進料日期', '吊裝日期'];
                    data = await fetchAllComponentsData(weightMap);
                } else if (type === 'received_today') {
                    headers = ['構件編號', '位置', '重量', '數量', '進料日期', '簽收時間'];
                    data = await fetchReceivedData(startDate, endDate, weightMap);
                } else if (type === 'lifted_today') {
                    headers = ['構件編號', '位置', '重量', '數量', '吊裝日期', '完成時間'];
                    data = await fetchLiftedData(startDate, endDate, weightMap);
                }

                currentData = data;
                renderTable(headers, data);

            } catch (error) {
                console.error('Report generation error:', error);
                alert('產生報表失敗：' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function fetchAllComponentsData(weightMap) {
            const [compRes, planRes, confRes, finRes] = await Promise.all([
                db.from('components').select('*'),
                db.from('planned').select('*'),
                db.from('confirm').select('*'),
                db.from('finished').select('*')
            ]);

            if (compRes.error) throw compRes.error;

            const components = compRes.data || [];
            const planned = planRes.data || [];
            const confirm = confRes.data || [];
            const finished = finRes.data || [];

            return components.map(c => {
                const p = planned.find(x => x.item_id === c.item_id && x.position === c.position);
                const cf = confirm.find(x => x.item_id === c.item_id && x.position === c.position);
                const f = finished.find(x => x.item_id === c.item_id && x.position === c.position);

                let status = '未進料';
                let statusClass = 'status-none';

                if (f) { status = '已吊裝'; statusClass = 'status-lifted'; }
                else if (cf) { status = '已進料'; statusClass = 'status-received'; }
                else if (p) { status = '已登記'; statusClass = 'status-planned'; }

                return {
                    '構件編號': c.item_id,
                    '位置': c.position,
                    '規格': c.spec || '',
                    '重量': c.weight || 0,
                    '狀態': `<span class="status-badge ${statusClass}">${status}</span>`,
                    '預計日期': p?.planned_date || '',
                    '進料日期': cf?.confirmed_date || '',
                    '吊裝日期': f?.lifted_date || '',
                    _rawStatus: status
                };
            });
        }

        async function fetchReceivedData(startDate, endDate, weightMap) {
            const { data, error } = await db.from('confirm')
                .select('*')
                .gte('confirmed_date', startDate)
                .lte('confirmed_date', endDate);

            if (error) throw error;

            return (data || []).map(item => ({
                '構件編號': item.item_id,
                '位置': item.position,
                '重量': weightMap.get(`${item.item_id}|${item.position}`) || 0,
                '數量': item.qty,
                '進料日期': item.confirmed_date,
                '簽收時間': new Date(item.created_at).toLocaleString()
            }));
        }

        async function fetchLiftedData(startDate, endDate, weightMap) {
            const { data, error } = await db.from('finished')
                .select('*')
                .gte('lifted_date', startDate)
                .lte('lifted_date', endDate);

            if (error) throw error;

            return (data || []).map(item => ({
                '構件編號': item.item_id,
                '位置': item.position,
                '重量': weightMap.get(`${item.item_id}|${item.position}`) || 0,
                '數量': item.qty,
                '吊裝日期': item.lifted_date,
                '完成時間': new Date(item.created_at).toLocaleString()
            }));
        }

        function renderTable(headers, data) {
            const thead = document.getElementById('tableHeader');
            const tbody = document.getElementById('tableBody');

            thead.innerHTML = headers.map(h => `<th>${h}</th>`).join('');

            if (data.length === 0) {
                document.getElementById('noData').style.display = 'block';
                return;
            }

            tbody.innerHTML = data.map(row => {
                return `<tr>${headers.map(h => `<td>${row[h] || ''}</td>`).join('')}</tr>`;
            }).join('');
        }

        function getExportData() {
            if (!currentData || currentData.length === 0) {
                alert('無資料可匯出');
                return null;
            }
            return currentData.map(row => {
                const newRow = { ...row };
                if (newRow._rawStatus) {
                    newRow['狀態'] = newRow._rawStatus;
                    delete newRow._rawStatus;
                }
                return newRow;
            });
        }

        function exportExcel() {
            const data = getExportData();
            if (!data) return;

            const type = document.getElementById('reportType').options[document.getElementById('reportType').selectedIndex].text;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const filename = `${type}_${startDate}_to_${endDate}.xlsx`;

            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Report");
            XLSX.writeFile(wb, filename);
        }

        function exportCSV() {
            const data = getExportData();
            if (!data) return;

            const type = document.getElementById('reportType').options[document.getElementById('reportType').selectedIndex].text;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const filename = `${type}_${startDate}_to_${endDate}.csv`;

            const ws = XLSX.utils.json_to_sheet(data);
            const csv = XLSX.utils.sheet_to_csv(ws);

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
    <script src="backToTop.js"></script>
</body>

</html>
