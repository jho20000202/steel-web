<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日吊裝記錄</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="mobile.css">
    <style>
        body {
            padding: 20px;
            background: #0f1320;
            color: #fff;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-title {
            font-size: 24px;
            font-weight: bold;
        }

        .back-btn {
            padding: 10px 20px;
            background: #2f3340;
            color: #fff;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: #3e4452;
        }

        .action-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .input-box {
            padding: 10px 16px;
            border-radius: 10px;
            background: #2a2b31;
            border: 1px solid #3e414b;
            color: #fff;
            font-size: 15px;
            max-width: 300px;
        }

        .input-box:focus {
            outline: none;
            border-color: #3d7bff;
        }

        .select-all-btn,
        .confirm-btn {
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .select-all-btn {
            background: #6c757d;
            color: #fff;
        }

        .select-all-btn:hover {
            background: #5a6268;
        }

        .confirm-btn {
            background: #28a745;
            color: #fff;
        }

        .confirm-btn:hover {
            background: #218838;
        }

        .confirm-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card {
            background: #1c2433;
            border-radius: 12px;
            padding: 16px 20px;
            border: 1px solid #2f3340;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .card.selected {
            border-color: #28a745;
            background: #1e2d1e;
        }

        .card.unselected {
            border-color: #dc3545;
            background: #2d1e1e;
        }

        .card.hidden {
            display: none;
        }

        .card-info {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            flex: 1;
        }

        .card-id {
            font-size: 18px;
            font-weight: bold;
            color: #3d7bff;
            min-width: 100px;
        }

        .card-detail {
            font-size: 15px;
            color: #fff;
        }

        .card-meta {
            color: #aaa;
            font-size: 14px;
            margin-right: 6px;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .checkbox-label {
            font-size: 15px;
            color: #fff;
            cursor: pointer;
            user-select: none;
        }

        @media (max-width: 768px) {
            .card {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .checkbox-wrapper {
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>

<body>
    <div class="header-row">
        <div class="header-title">每日吊裝記錄</div>
        <a href="index.html" class="back-btn">返回主畫面</a>
    </div>

    <div class="action-bar">
        <input type="text" id="searchBox" class="input-box" placeholder="搜尋構件編號或位置..." oninput="filterItems()">
        <button class="select-all-btn" onclick="toggleSelectAll()">全選 / 全不選</button>
        <button class="confirm-btn" id="confirmBtn" onclick="confirmLifted()">確認吊裝</button>
        <span id="selectedCount" style="color: #aaa; font-size: 14px;">已選擇: 0 項</span>
    </div>

    <div class="cards-container" id="cardsContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <script src="back.js"></script>
    <script>
        const db = window.supabaseClient;
        let confirmItems = [];
        let selectedItems = new Set();

        document.addEventListener('DOMContentLoaded', () => {
            loadConfirmItems();
        });

        async function loadConfirmItems() {
            const { data, error } = await db.from('confirm')
                .select('*')
                .is('lifted_at', null)
                .order('confirmed_date', { ascending: true });

            if (error) {
                console.error('Error loading confirm items:', error);
                return;
            }

            confirmItems = data || [];
            selectedItems = new Set(confirmItems.map(item => item.id));
            renderCards();
            updateSelectedCount();
        }

        function filterItems() {
            const searchTerm = document.getElementById('searchBox').value.trim().toUpperCase();
            const cards = document.querySelectorAll('.card');

            confirmItems.forEach((item, index) => {
                const card = cards[index];
                if (!card) return;

                const matchesSearch = !searchTerm ||
                    item.item_id.toUpperCase().includes(searchTerm) ||
                    item.position.toUpperCase().includes(searchTerm);

                if (matchesSearch) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            if (confirmItems.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#777; padding:40px;">尚無待吊裝的構件</div>';
                return;
            }

            confirmItems.forEach(item => {
                const isSelected = selectedItems.has(item.id);
                const card = document.createElement('div');
                card.className = `card ${isSelected ? 'selected' : 'unselected'}`;
                card.setAttribute('data-id', item.id);
                card.innerHTML = `
                    <div class="card-info">
                        <div class="card-id">${item.item_id}</div>
                        <div class="card-detail"><span class="card-meta">位置:</span>${item.position}</div>
                        <div class="card-detail"><span class="card-meta">預計日期:</span>${item.planned_date || 'N/A'}</div>
                        <div class="card-detail"><span class="card-meta">簽收日期:</span>${item.confirmed_date || 'N/A'}</div>
                        <div class="card-detail"><span class="card-meta">數量:</span>${item.qty}</div>
                    </div>
                    <div class="checkbox-wrapper">
                        <input type="checkbox" class="checkbox" id="check-${item.id}" 
                               ${isSelected ? 'checked' : ''} 
                               onchange="toggleItem('${item.id}')">
                        <label class="checkbox-label" for="check-${item.id}">
                            ${isSelected ? '已吊裝' : '未吊裝'}
                        </label>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleItem(id) {
            if (selectedItems.has(id)) {
                selectedItems.delete(id);
            } else {
                selectedItems.add(id);
            }
            renderCards();
            updateSelectedCount();
            filterItems();
        }

        function toggleSelectAll() {
            if (selectedItems.size === confirmItems.length) {
                selectedItems.clear();
            } else {
                selectedItems = new Set(confirmItems.map(item => item.id));
            }
            renderCards();
            updateSelectedCount();
            filterItems();
        }

        function updateSelectedCount() {
            const count = selectedItems.size;
            document.getElementById('selectedCount').textContent = `已選擇: ${count} 項`;
            document.getElementById('confirmBtn').disabled = count === 0;
        }

        async function confirmLifted() {
            if (selectedItems.size === 0) {
                alert('請至少選擇一項構件');
                return;
            }

            const confirmBtn = document.getElementById('confirmBtn');
            confirmBtn.disabled = true;
            confirmBtn.textContent = '⏳ 處理中...';

            const selectedItemsData = confirmItems.filter(item => selectedItems.has(item.id));
            const currentTime = new Date().toISOString();
            let successCount = 0;
            let failCount = 0;

            for (const item of selectedItemsData) {
                try {
                    const { error: updateError } = await db.from('confirm')
                        .update({ lifted_at: currentTime })
                        .eq('id', item.id);

                    if (updateError) {
                        console.error('Update error:', updateError);
                        failCount++;
                        continue;
                    }

                    const { error: insertError } = await db.from('finished').insert([{
                        item_id: item.item_id,
                        position: item.position,
                        planned_date: item.planned_date,
                        confirmed_date: item.confirmed_date,
                        lifted_date: new Date().toISOString().split('T')[0],
                        qty: item.qty
                    }]);

                    if (insertError) {
                        console.error('Insert error:', insertError);
                        failCount++;
                    } else {
                        successCount++;
                    }
                } catch (err) {
                    console.error('Error processing item:', err);
                    failCount++;
                }
            }

            confirmBtn.disabled = false;
            confirmBtn.textContent = '✓ 確認吊裝';

            if (failCount > 0) {
                alert(`處理完成！\n成功: ${successCount} 項\n失敗: ${failCount} 項`);
            } else {
                alert(`✅ 吊裝確認成功！\n\n已處理 ${successCount} 項構件`);
            }

            await loadConfirmItems();
        }
    </script>
    <script src="backToTop.js"></script>
</body>

</html>
