<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>預計進料登記</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="mobile.css">
    <style>
        body {
            padding: 20px;
            background: #0f1320;
            color: #fff;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-title {
            font-size: 24px;
            font-weight: bold;
        }

        .back-btn {
            padding: 10px 20px;
            background: #2f3340;
            color: #fff;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: #3e4452;
        }

        .form-section {
            background: #1c2433;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 24px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 13px;
            color: #aaa;
        }

        .input-box,
        select {
            padding: 12px;
            border-radius: 10px;
            background: #2a2b31;
            border: 1px solid #3e414b;
            color: #fff;
            font-size: 15px;
        }

        .input-box:focus,
        select:focus {
            outline: none;
            border-color: #3d7bff;
        }

        .primary-btn {
            width: 100%;
            padding: 14px;
            background: #3d7bff;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        .primary-btn:hover {
            background: #2a65e6;
        }

        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: #1c2433;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #2f3340;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-id {
            font-size: 18px;
            font-weight: bold;
            color: #3d7bff;
        }

        .card-detail {
            font-size: 14px;
            color: #ccc;
            margin-top: 4px;
        }

        .card-meta {
            color: #777;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-confirm {
            padding: 10px 20px;
            background: #28a745;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
        }

        .btn-confirm:hover {
            background: #218838;
        }

        .btn-delete {
            padding: 10px 20px;
            background: #dc3545;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: #1c2433;
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #2f3340;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .modal-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 16px;
            color: #fff;
        }

        .modal-content {
            margin-bottom: 24px;
            color: #ccc;
            line-height: 1.5;
            font-size: 16px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn-cancel {
            padding: 10px 20px;
            background: #2f3340;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-cancel:hover {
            background: #3e4452;
        }

        .btn-confirm-action {
            padding: 10px 20px;
            background: #dc3545;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-confirm-action:hover {
            background: #c82333;
        }
    </style>
</head>

<body>
    <div class="header-row">
        <div class="header-title">預計進料登記</div>
        <a href="SteelMaterial.html" class="back-btn">返回主畫面</a>
    </div>
    <div class="form-section">
        <div style="margin-bottom:16px; font-size:16px; font-weight:600;">新增預計進料</div>
        <div class="form-grid">
            <div class="input-group">
                <label>構件編號</label>
                <input id="itemId" class="input-box" placeholder="輸入構件編號" onchange="loadPositions()">
            </div>
            <div class="input-group">
                <label>構件位置</label>
                <select id="position" class="input-box">
                    <option value="">請先選擇構件編號</option>
                </select>
            </div>
            <div class="input-group">
                <label>預計進料日期</label>
                <input id="plannedDate" type="date" class="input-box">
            </div>
            <div class="input-group">
                <label>數量</label>
                <input id="qty" type="number" class="input-box" placeholder="數量" value="1" min="1">
            </div>
        </div>
        <button class="primary-btn" onclick="addPlannedItem()">登記預計進料</button>
    </div>
    <div class="cards-container" id="cardsContainer"></div>

    <!-- Custom Confirmation Modal -->
    <div id="confirmModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-title">確認刪除</div>
            <div class="modal-content" id="modalMessage"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-confirm-action" onclick="executeDelete()">確定刪除</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <script src="back.js"></script>
    <script>
        const db = window.supabaseClient;
        let allComponents = [];
        let plannedItems = [];
        let deleteTarget = null;

        // Modal Functions
        function showDeleteModal(id, itemId, position) {
            deleteTarget = { id, itemId, position };
            document.getElementById('modalMessage').textContent = `確定要刪除 ${itemId} (${position}) 的預計進料登記嗎？`;
            document.getElementById('confirmModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('confirmModal').style.display = 'none';
            deleteTarget = null;
        }

        async function executeDelete() {
            if (!deleteTarget) return;
            const { id, itemId, position } = deleteTarget;

            // Change button text to indicate loading
            const confirmBtn = document.querySelector('.btn-confirm-action');
            const originalText = confirmBtn.textContent;
            confirmBtn.textContent = '刪除中...';
            confirmBtn.disabled = true;

            try {
                const { error } = await db.from('planned')
                    .delete()
                    .eq('item_id', itemId)
                    .eq('position', position);

                if (error) {
                    console.error('Delete error:', error);
                    alert('刪除失敗：' + error.message);
                } else {
                    // alert('✅ 刪除成功！'); // Optional: remove alert for smoother UX
                    await loadAllData();
                }
            } catch (err) {
                console.error('Delete exception:', err);
                alert('刪除失敗：' + err.message);
            } finally {
                confirmBtn.textContent = originalText;
                confirmBtn.disabled = false;
                closeModal();
            }
        }

        // Main Functions
        async function confirmItem(event, id, itemId, position, plannedDate, qty) {
            const btn = document.getElementById(`confirm-${id}`);
            if (!btn) {
                alert('錯誤：找不到按鈕元素');
                return;
            }

            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳ 處理中...';
            btn.disabled = true;

            const { error: updateError } = await db.from('planned')
                .update({ received_at: new Date().toISOString() })
                .eq('id', id);

            if (updateError) {
                btn.innerHTML = originalText;
                btn.disabled = false;
                alert('更新簽收時間失敗：' + updateError.message);
                return;
            }

            const { error: confirmError } = await db.from('confirm').insert([{
                item_id: itemId,
                position: position,
                planned_date: plannedDate,
                qty: qty
            }]);

            if (confirmError) {
                btn.innerHTML = originalText;
                btn.disabled = false;
                alert('新增至確認簽收表失敗：' + confirmError.message);
                return;
            }

            btn.innerHTML = '✓ 已簽收';
            btn.style.background = '#218838';
            alert('✅ 簽收成功！\n\n已更新簽收時間並新增至確認簽收表');
            await loadAllData();
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            if (plannedItems.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#777; padding:40px;">尚無預計進料登記</div>';
                return;
            }

            plannedItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div style="flex: 1;">
                        <div class="card-id">${item.item_id} - ${item.position}</div>
                        <div class="card-detail"><span class="card-meta">日期:</span> ${item.planned_date} | <span class="card-meta">數量:</span> ${item.qty}</div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-confirm" id="confirm-${item.id}" onclick="confirmItem(event, '${item.id}', '${item.item_id}', '${item.position}', '${item.planned_date}', ${item.qty})">✓ 確認簽收</button>
                        <button class="btn-delete" onclick="showDeleteModal('${item.id}', '${item.item_id}', '${item.position}')">✕ 刪除</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function loadAllData() {
            if (!db) return;
            const { data: components, error: compError } = await db.from('components').select('*');
            if (compError) { console.error('Error loading components:', compError); return; }
            allComponents = components || [];
            await loadPlannedItems();
        }

        async function loadPlannedItems() {
            const { data, error } = await db.from('planned')
                .select('*')
                .is('received_at', null)
                .order('planned_date', { ascending: true });
            if (error) { console.error('Error loading planned items:', error); return; }
            plannedItems = data || [];
            renderCards();
        }

        async function loadPositions() {
            const itemId = document.getElementById('itemId').value.trim().toUpperCase();
            const positionSelect = document.getElementById('position');
            positionSelect.innerHTML = '<option value="">載入中...</option>';

            if (!itemId) {
                positionSelect.innerHTML = '<option value="">請先選擇構件編號</option>';
                return;
            }

            const availablePositions = allComponents
                .filter(c => c.item_id === itemId)
                .map(c => c.position)
                .filter(p => p);

            if (availablePositions.length === 0) {
                positionSelect.innerHTML = '<option value="">找不到此構件編號</option>';
                return;
            }

            // 獲取所有已使用的位置（從 planned, confirm, finished 三個表）
            const [plannedRes, confirmRes, finishedRes] = await Promise.all([
                db.from('planned').select('position').eq('item_id', itemId),
                db.from('confirm').select('position').eq('item_id', itemId),
                db.from('finished').select('position').eq('item_id', itemId)
            ]);

            const usedPositions = new Set([
                ...(plannedRes.data || []).map(p => p.position),
                ...(confirmRes.data || []).map(p => p.position),
                ...(finishedRes.data || []).map(p => p.position)
            ]);

            const unusedPositions = availablePositions.filter(p => !usedPositions.has(p));

            if (unusedPositions.length === 0) {
                positionSelect.innerHTML = '<option value="">所有位置已登記</option>';
                return;
            }

            positionSelect.innerHTML = '<option value="">請選擇位置</option>';
            unusedPositions.forEach(pos => {
                const option = document.createElement('option');
                option.value = pos;
                option.textContent = pos;
                positionSelect.appendChild(option);
            });
        }

        async function addPlannedItem() {
            const itemId = document.getElementById('itemId').value.trim().toUpperCase();
            const position = document.getElementById('position').value;
            const plannedDate = document.getElementById('plannedDate').value;
            const qty = parseInt(document.getElementById('qty').value);

            if (!itemId || !position || !plannedDate || !qty) {
                alert('請填寫所有欄位');
                return;
            }

            const componentExists = allComponents.some(c => c.item_id === itemId && c.position === position);
            if (!componentExists) {
                alert('此構件編號和位置組合不存在於構件庫中');
                return;
            }

            const { error } = await db.from('planned').upsert([{
                item_id: itemId,
                position: position,
                planned_date: plannedDate,
                qty: qty
            }], {
                onConflict: 'item_id,position'
            });

            if (error) {
                console.error('Upsert error:', error);
                alert('登記失敗：' + error.message);
                return;
            }

            alert(' 登記成功！');

            document.getElementById('itemId').value = '';
            document.getElementById('position').innerHTML = '<option value="">請先選擇構件編號</option>';
            document.getElementById('plannedDate').valueAsDate = new Date();
            document.getElementById('qty').value = '1';
            await loadAllData();
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadAllData();
            document.getElementById('plannedDate').valueAsDate = new Date();
        });
    </script>
    <script src="backToTop.js"></script>
</body>

</html>
