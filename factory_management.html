<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皆豪加工廠管理系統</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .container {
            max-width: 1200px;
            width: 90%;
            margin: 0 auto;
            padding: 40px 20px;
            flex: 1;
        }

        .page-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .logo-img {
            height: 80px;
            margin-bottom: 16px;
        }

        .page-title {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 12px;
            color: var(--highlight);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .system-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 40px;
        }

        .system-card {
            background: var(--card);
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .system-card:hover {
            transform: translateY(-6px);
            border-color: var(--primary);
            box-shadow: 0 15px 30px rgba(195, 164, 14, 0.15);
        }

        .system-card.active {
            cursor: pointer;
        }

        .system-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text);
        }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
        }

        .status-active {
            background: rgba(195, 164, 14, 0.2);
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .page-title {
                font-size: 28px;
            }

            .system-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .system-card {
                padding: 24px;
            }
        }

        .system-card.coming-soon {
            cursor: not-allowed;
            opacity: 0.6;
            border-color: #333;
        }

        .status-coming {
            background: rgba(100, 100, 100, 0.2);
            color: var(--muted);
            border: 1px solid #444;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="page-header" style="position: relative;">
            <button onclick="window.location.href='index.html'" style="
                position: absolute;
                top: 0;
                right: 0;
                background: rgba(195, 164, 14, 0.1);
                border: 1px solid var(--primary);
                color: var(--primary);
                padding: 8px 16px;
                border-radius: 20px;
                cursor: pointer;
                font-size: 14px;
                transition: all 0.3s;
                display: flex;
                align-items: center;
                gap: 6px;
            " onmouseover="this.style.background='rgba(195, 164, 14, 0.2)'"
                onmouseout="this.style.background='rgba(195, 164, 14, 0.1)'">
                工程管理系統
            </button>
            <img src="logo.png" alt="Logo" class="logo-img">
            <h1 class="page-title">皆豪加工廠管理系統</h1>
        </div>

        <div class="system-grid">
            <!-- 加工進度 -->
            <!-- 加工進度 -->
            <div class="system-card coming-soon">
                <div class="system-name">加工進度</div>
                <span class="status-badge status-coming">開發中</span>
            </div>

            <!-- 出料資訊 -->
            <div class="system-card active" onclick="window.location.href='shipment.html'">
                <div class="system-name">出料資訊</div>
                <span class="status-badge status-active">● 已啟用</span>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.coming-soon').forEach(card => {
            card.addEventListener('click', (e) => {
                e.preventDefault();
                alert('即將推出！');
            });
        });
    </script>
    <script src="backToTop.js"></script>
</body>

</html>
