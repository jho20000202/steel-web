<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>進度表</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="mobile.css">
    <style>
        body {
            padding: 20px;
            background: var(--bg);
            color: var(--text);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--highlight);
        }

        .back-btn {
            padding: 10px 20px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: #2a2a2a;
        }

        .search-section {
            background: var(--card);
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            background: #252525;
            border: 1px solid var(--border);
            color: #fff;
            font-size: 15px;
        }

        .search-controls {
            display: flex;
            gap: 10px;
        }

        .sort-box {
            padding: 12px 16px;
            border-radius: 10px;
            background: #252525;
            border: 1px solid var(--border);
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            min-width: 160px;
        }

        .sort-box:focus {
            outline: none;
            border-color: var(--primary);
        }

        .result-count {
            margin-bottom: 10px;
            color: var(--muted);
            font-size: 14px;
            padding-left: 4px;
        }

        @media (max-width: 768px) {
            .search-controls {
                flex-direction: column;
            }

            .sort-box {
                width: 100%;
            }
        }


        .search-box::placeholder {
            color: var(--muted);
        }

        .progress-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (min-width: 768px) {
            .progress-section {
                flex-direction: row;
            }
        }

        .stats-card {
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid var(--border);
        }

        .progress-title {
            font-size: 16px;
            color: var(--muted);
            margin-bottom: 20px;
            width: 100%;
            text-align: center;
        }

        .progress-circle {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 16px;
        }

        .progress-svg {
            transform: rotate(-90deg);
        }

        .progress-bg {
            fill: none;
            stroke: #2f3340;
            stroke-width: 12;
        }

        .progress-bar {
            fill: none;
            stroke-width: 12;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s;
        }

        .progress-bar.received {
            stroke: var(--ok);
        }

        .progress-bar.lifted {
            stroke: var(--primary);
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: bold;
            color: var(--text);
        }

        .progress-label {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 12px;
            width: 100%;
            text-align: center;
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            width: 100%;
            padding: 0 10%;
            box-sizing: border-box;
        }

        .stat-item {
            flex: 1;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
        }

        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
        }

        .card:hover {
            border-color: var(--primary);
            background: #252b3b;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-id {
            font-size: 18px;
            font-weight: bold;
            color: var(--highlight);
        }

        .card-status {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .status-planned {
            background: rgba(195, 164, 14, 0.2);
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .status-received {
            background: rgba(39, 174, 96, 0.2);
            color: var(--ok);
            border: 1px solid var(--ok);
        }

        .status-lifted {
            background: rgba(233, 211, 84, 0.2);
            color: var(--highlight);
            border: 1px solid var(--highlight);
        }

        .card-timeline {
            display: flex;
            gap: 16px;
            justify-content: space-between;
        }

        .timeline-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 13px;
            flex: 1;
        }

        .timeline-label {
            color: var(--muted);
            font-size: 12px;
        }

        .timeline-time {
            color: var(--text);
            font-weight: 500;
        }

        .card-details {
            display: none;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .card-details.show {
            display: block;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .detail-label {
            color: var(--muted);
            font-size: 12px;
        }

        .detail-value {
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="header-row">
        <div class="header-title">進度表</div>
        <a href="SteelMaterial.html" class="back-btn">返回主畫面</a>
    </div>

    <div class="search-section">
        <div class="search-controls">
            <input type="text" id="searchBox" class="search-box" placeholder="搜尋構件編號、位置或規格...">
            <select id="sortSelect" class="sort-box">
                <option value="item_id_asc">排序：構件編號</option>
                <option value="planned_desc">排序：預計進料 (新到舊)</option>
                <option value="received_desc">排序：已進料 (新到舊)</option>
                <option value="lifted_desc">排序：已吊裝 (新到舊)</option>
            </select>
        </div>
    </div>

    <div class="progress-section">
        <!-- Stats Cards (unchanged) -->
        <div class="stats-card">
            <div class="progress-title">已進料進度</div>
            <div class="progress-circle">
                <svg class="progress-svg" viewBox="0 0 150 150" width="150" height="150">
                    <circle class="progress-bg" cx="75" cy="75" r="65"></circle>
                    <circle id="receivedCircle" class="progress-bar received" cx="75" cy="75" r="65"></circle>
                </svg>
                <div class="progress-text" id="receivedPercent">0%</div>
            </div>
            <div class="progress-label">已簽收構件</div>
            <div class="progress-stats">
                <div class="stat-item">
                    <div class="stat-label">構件數</div>
                    <div class="stat-value" id="receivedCount">0 / 0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">重量</div>
                    <div class="stat-value" id="receivedWeight">0 / 0 kg</div>
                </div>
            </div>
        </div>

        <div class="stats-card">
            <div class="progress-title">已吊裝進度</div>
            <div class="progress-circle">
                <svg class="progress-svg" viewBox="0 0 150 150" width="150" height="150">
                    <circle class="progress-bg" cx="75" cy="75" r="65"></circle>
                    <circle id="liftedCircle" class="progress-bar lifted" cx="75" cy="75" r="65"></circle>
                </svg>
                <div class="progress-text" id="liftedPercent">0%</div>
            </div>
            <div class="progress-label">已完成吊裝</div>
            <div class="progress-stats">
                <div class="stat-item">
                    <div class="stat-label">構件數</div>
                    <div class="stat-value" id="liftedCount">0 / 0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">重量</div>
                    <div class="stat-value" id="liftedWeight">0 / 0 kg</div>
                </div>
            </div>
        </div>
    </div>

    <div id="resultCount" class="result-count"></div>
    <div class="cards-container" id="cardsContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <script src="back.js"></script>
    <script>
        const db = window.supabaseClient;
        let allComponents = [];
        let filteredComponents = [];
        let plannedItems = [];
        let confirmedItems = [];
        let finishedItems = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadAllData();

            document.getElementById('searchBox').addEventListener('input', (e) => {
                applyFilterAndSort();
            });

            document.getElementById('sortSelect').addEventListener('change', (e) => {
                applyFilterAndSort();
            });
        });

        async function loadAllData() {
            if (!db) return;

            const [componentsRes, plannedRes, confirmedRes, finishedRes] = await Promise.all([
                db.from('components').select('*'),
                db.from('planned').select('*'),
                db.from('confirm').select('*'),
                db.from('finished').select('*')
            ]);

            allComponents = componentsRes.data || [];
            filteredComponents = allComponents;
            plannedItems = plannedRes.data || [];
            confirmedItems = confirmedRes.data || [];
            finishedItems = finishedRes.data || [];

            updateProgress();
            applyFilterAndSort(); // Initial render with default sort
        }

        function applyFilterAndSort() {
            const keyword = document.getElementById('searchBox').value.toLowerCase().trim();
            const sortValue = document.getElementById('sortSelect').value;

            // 1. Filter
            if (keyword === '') {
                filteredComponents = [...allComponents];
            } else {
                filteredComponents = allComponents.filter(component =>
                    (component.item_id || '').toLowerCase().includes(keyword) ||
                    (component.position || '').toLowerCase().includes(keyword) ||
                    (component.spec || '').toLowerCase().includes(keyword)
                );
            }

            // 2. Sort
            filteredComponents.sort((a, b) => {
                if (sortValue === 'item_id_asc') {
                    // Sort by Item ID then Position
                    const idDiff = (a.item_id || '').localeCompare(b.item_id || '');
                    if (idDiff !== 0) return idDiff;
                    return (a.position || '').localeCompare(b.position || '');
                }

                const getDate = (comp, list) => {
                    const item = list.find(p => p.item_id === comp.item_id && p.position === comp.position);
                    return item ? new Date(item.created_at).getTime() : 0;
                };

                let dateA = 0, dateB = 0;
                if (sortValue === 'planned_desc') {
                    dateA = getDate(a, plannedItems);
                    dateB = getDate(b, plannedItems);
                } else if (sortValue === 'received_desc') {
                    dateA = getDate(a, confirmedItems);
                    dateB = getDate(b, confirmedItems);
                } else if (sortValue === 'lifted_desc') {
                    dateA = getDate(a, finishedItems);
                    dateB = getDate(b, finishedItems);
                }

                // If dates are equal (or both 0), fallback to ID sort to be stable
                if (dateB !== dateA) return dateB - dateA;
                return (a.item_id || '').localeCompare(b.item_id || '');
            });

            renderCards();
        }

        function updateProgress() {
            const totalComponents = allComponents.reduce((sum, c) => sum + (parseInt(c.qty) || 1), 0);
            const receivedCount = confirmedItems.reduce((sum, c) => sum + (parseInt(c.qty) || 1), 0);
            const liftedCount = finishedItems.reduce((sum, c) => sum + (parseInt(c.qty) || 1), 0);

            const totalWeight = allComponents.reduce((sum, c) => sum + (parseFloat(c.weight) || 0) * (parseInt(c.qty) || 1), 0);
            const receivedWeight = confirmedItems.reduce((sum, item) => {
                const component = allComponents.find(c => c.item_id === item.item_id && c.position === item.position);
                return sum + (component ? (parseFloat(component.weight) || 0) * (parseInt(item.qty) || 1) : 0);
            }, 0);
            const liftedWeight = finishedItems.reduce((sum, item) => {
                const component = allComponents.find(c => c.item_id === item.item_id && c.position === item.position);
                return sum + (component ? (parseFloat(component.weight) || 0) * (parseInt(item.qty) || 1) : 0);
            }, 0);

            const receivedPercent = totalComponents > 0 ? Math.round((receivedCount / totalComponents) * 100) : 0;
            const liftedPercent = totalComponents > 0 ? Math.round((liftedCount / totalComponents) * 100) : 0;

            const circumference = 2 * Math.PI * 65;
            const receivedOffset = circumference - (receivedPercent / 100) * circumference;
            const liftedOffset = circumference - (liftedPercent / 100) * circumference;

            document.getElementById('receivedCircle').style.strokeDasharray = circumference;
            document.getElementById('receivedCircle').style.strokeDashoffset = receivedOffset;
            document.getElementById('liftedCircle').style.strokeDasharray = circumference;
            document.getElementById('liftedCircle').style.strokeDashoffset = liftedOffset;

            document.getElementById('receivedPercent').textContent = receivedPercent + '%';
            document.getElementById('liftedPercent').textContent = liftedPercent + '%';
            document.getElementById('receivedCount').textContent = receivedCount + ' / ' + totalComponents;
            document.getElementById('liftedCount').textContent = liftedCount + ' / ' + totalComponents;
            document.getElementById('receivedWeight').textContent = Math.round(receivedWeight) + ' / ' + Math.round(totalWeight) + ' kg';
            document.getElementById('liftedWeight').textContent = Math.round(liftedWeight) + ' / ' + Math.round(totalWeight) + ' kg';
        }

        function toggleDetails(cardId) {
            const details = document.getElementById(`details-${cardId}`);
            details.classList.toggle('show');
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            const resultCount = document.getElementById('resultCount');

            container.innerHTML = '';

            // Update result count text
            if (filteredComponents.length > 0) {
                resultCount.textContent = `共搜尋到 ${filteredComponents.length} 筆結果`;
                resultCount.style.display = 'block';
            } else {
                resultCount.style.display = 'none';
            }

            if (allComponents.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#777; padding:40px;">尚無構件資料</div>';
                return;
            }

            if (filteredComponents.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#777; padding:40px;">找不到符合的構件</div>';
                resultCount.textContent = `共搜尋到 0 筆結果`;
                resultCount.style.display = 'block';
                return;
            }

            filteredComponents.forEach((component, index) => {
                const planned = plannedItems.find(p => p.item_id === component.item_id && p.position === component.position);
                const confirmed = confirmedItems.find(c => c.item_id === component.item_id && c.position === component.position);
                const finished = finishedItems.find(f => f.item_id === component.item_id && f.position === component.position);

                let status = 'planned';
                let statusText = '未登記';
                if (finished) {
                    status = 'lifted';
                    statusText = '已吊裝';
                } else if (confirmed) {
                    status = 'received';
                    statusText = '已簽收';
                } else if (planned) {
                    status = 'planned';
                    statusText = '已登記';
                }

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => toggleDetails(index);
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-id">${component.item_id} - ${component.position}</div>
                        <div class="card-status status-${status}">${statusText}</div>
                    </div>
                    <div class="card-timeline">
                        <div class="timeline-item">
                            <div class="timeline-label">預計進料</div>
                            <div class="timeline-time">${planned ? formatDate(planned.created_at) : '-'}</div>
                        </div>
                        <div class="timeline-item">
                            <div class="timeline-label">已進料</div>
                            <div class="timeline-time">${confirmed ? formatDate(confirmed.created_at) : '-'}</div>
                        </div>
                        <div class="timeline-item">
                            <div class="timeline-label">已吊裝</div>
                            <div class="timeline-time">${finished ? formatDate(finished.created_at) : '-'}</div>
                        </div>
                    </div>
                    <div class="card-details" id="details-${index}">
                        <div class="detail-grid">
                            <div class="detail-item">
                                <div class="detail-label">規格</div>
                                <div class="detail-value">${component.spec || '-'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">材質</div>
                                <div class="detail-value">${component.material || '-'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">重量 (kg)</div>
                                <div class="detail-value">${component.weight || '-'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">數量</div>
                                <div class="detail-value">${component.qty || '-'}</div>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${month}/${day} ${hours}:${minutes}`;
        }
    </script>
    <script src="backToTop.js"></script>
</body>

</html>
