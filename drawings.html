<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>施工圖面管理</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="mobile.css">
    <style>
        body {
            padding: 20px;
            background: #0f1320;
            color: #fff;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-title {
            font-size: 24px;
            font-weight: bold;
        }

        .back-btn {
            padding: 10px 20px;
            background: #2f3340;
            color: #fff;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: #3e4452;
        }

        /* 搜尋區域 */
        .search-section {
            background: #1c2433;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .search-box {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            background: #2a2b31;
            border: 1px solid #3e414b;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }

        .search-box:focus {
            outline: none;
            border-color: #3d7bff;
        }

        /* 圖面卡片列表 */
        .drawings-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .drawing-card {
            background: #1c2433;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #2f3340;
            cursor: pointer;
            transition: all 0.2s;
        }

        .drawing-card:hover {
            background: #242d3f;
            border-color: #3d7bff;
            transform: translateY(-2px);
        }

        .drawing-id {
            font-size: 18px;
            font-weight: bold;
            color: #3d7bff;
            margin-bottom: 12px;
        }

        .drawing-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .info-row {
            display: flex;
            gap: 8px;
            font-size: 14px;
        }

        .info-label {
            color: #777;
            min-width: 80px;
        }

        .info-value {
            color: #eee;
            flex: 1;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #777;
            font-size: 16px;
        }

        /* 圖面預覽模態框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #1c2433;
            border-radius: 16px;
            padding: 24px;
            max-width: 95%;
            max-height: 95%;
            overflow: auto;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }

        .close-btn {
            background: #2f3340;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
        }

        .close-btn:hover {
            background: #3e4452;
        }

        .drawing-viewer {
            width: 100%;
            height: 80vh;
            border: none;
            border-radius: 12px;
            background: #fff;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #aaa;
        }
    </style>
</head>

<body>
    <div class="header-row">
        <div class="header-title">施工圖面管理</div>
        <a href="index.html" class="back-btn">返回上一頁</a>
    </div>

    <!-- 搜尋區域 -->
    <div class="search-section">
        <input type="text" id="searchInput" class="search-box" placeholder="輸入構件編號搜尋圖面...">
    </div>

    <!-- 圖面列表 -->
    <div id="drawingsContainer" class="drawings-container">
        <div class="loading">載入中...</div>
    </div>

    <!-- 圖面預覽模態框 -->
    <div id="drawingModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">圖面預覽</div>
                <button class="close-btn" onclick="closeDrawingModal()">關閉</button>
            </div>
            <iframe id="drawingViewer" class="drawing-viewer"></iframe>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <script src="back.js"></script>
    <script>
        const db = window.supabaseClient;
        let allDrawings = [];
        let filteredDrawings = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadDrawings();

            // 搜尋功能
            document.getElementById('searchInput').addEventListener('input', (e) => {
                const searchTerm = e.target.value.trim().toUpperCase();
                filterDrawings(searchTerm);
            });
        });

        async function loadDrawings() {
            if (!db) {
                console.error('Database not initialized');
                return;
            }

            try {
                const { data, error } = await db
                    .from('drawings')
                    .select('*')
                    .order('item_id', { ascending: true });

                if (error) {
                    console.error('Error loading drawings:', error);
                    document.getElementById('drawingsContainer').innerHTML =
                        '<div class="no-results">載入圖面失敗</div>';
                    return;
                }

                allDrawings = data || [];
                filteredDrawings = allDrawings;
                renderDrawings();
            } catch (err) {
                console.error('Exception loading drawings:', err);
                document.getElementById('drawingsContainer').innerHTML =
                    '<div class="no-results">載入圖面時發生錯誤</div>';
            }
        }

        function filterDrawings(searchTerm) {
            if (!searchTerm) {
                filteredDrawings = allDrawings;
            } else {
                filteredDrawings = allDrawings.filter(drawing => {
                    return fuzzyMatch(drawing.item_id || '', searchTerm) ||
                        fuzzyMatch(drawing.drawing_number || '', searchTerm);
                });
            }
            renderDrawings();
        }

        function fuzzyMatch(text, pattern) {
            if (!text || !pattern) return false;
            text = text.toUpperCase();
            pattern = pattern.toUpperCase();

            let patternIdx = 0;
            for (let i = 0; i < text.length && patternIdx < pattern.length; i++) {
                if (text[i] === pattern[patternIdx]) {
                    patternIdx++;
                }
            }
            return patternIdx === pattern.length;
        }

        function renderDrawings() {
            const container = document.getElementById('drawingsContainer');

            if (filteredDrawings.length === 0) {
                container.innerHTML = '<div class="no-results">找不到符合的圖面</div>';
                return;
            }

            container.innerHTML = filteredDrawings.map(drawing => `
                <div class="drawing-card" onclick="viewDrawing('${drawing.id}', '${escapeHtml(drawing.item_id)}', '${escapeHtml(drawing.file_url)}')">
                    <div class="drawing-id">${escapeHtml(drawing.item_id || '未命名')}</div>
                    <div class="drawing-info">
                        <div class="info-row">
                            <span class="info-label">圖號：</span>
                            <span class="info-value">${escapeHtml(drawing.drawing_number || '-')}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">檔案名稱：</span>
                            <span class="info-value">${escapeHtml(drawing.file_name || '-')}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">上傳日期：</span>
                            <span class="info-value">${formatDate(drawing.created_at)}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function viewDrawing(id, itemId, fileUrl) {
            if (!fileUrl) {
                alert('此圖面沒有檔案連結');
                return;
            }

            document.getElementById('modalTitle').textContent = `圖面預覽 - ${itemId}`;
            document.getElementById('drawingViewer').src = fileUrl;
            document.getElementById('drawingModal').classList.add('active');
        }

        function closeDrawingModal() {
            document.getElementById('drawingModal').classList.remove('active');
            document.getElementById('drawingViewer').src = '';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleDateString('zh-TW');
        }

        // 點擊模態框背景關閉
        document.getElementById('drawingModal').addEventListener('click', (e) => {
            if (e.target.id === 'drawingModal') {
                closeDrawingModal();
            }
        });
    </script>

    <script src="backToTop.js"></script>
</body>

</html>
