<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>匯入圖面清單到 Supabase</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            padding: 40px;
            background: var(--bg);
            color: var(--text);
            max-width: 800px;
            margin: 0 auto;
        }

        .container {
            background: var(--card);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid var(--border);
        }

        h1 {
            color: var(--highlight);
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--muted);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .step {
            background: #252525;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .step-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--highlight);
            margin-bottom: 15px;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-input {
            display: none;
        }

        .file-label {
            display: block;
            padding: 15px;
            background: #2f3340;
            border: 2px dashed var(--primary);
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-label:hover {
            background: #3e4452;
            border-color: #d4b520;
        }

        .file-name {
            margin-top: 10px;
            color: var(--primary);
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            border: none;
            border-radius: 12px;
            color: #000;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            background: #d4b520;
        }

        .btn:disabled {
            background: #2f3340;
            cursor: not-allowed;
            color: #888;
        }

        .btn-success {
            background: var(--ok);
            color: #fff;
        }

        .btn-success:hover {
            background: #218838;
        }

        .preview {
            max-height: 300px;
            overflow-y: auto;
            background: #111;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            border: 1px solid var(--border);
        }

        .preview-table {
            width: 100%;
            font-size: 13px;
            border-collapse: collapse;
        }

        .preview-table th {
            background: #2f3340;
            padding: 8px;
            text-align: left;
            position: sticky;
            top: 0;
            color: var(--highlight);
        }

        .preview-table td {
            padding: 8px;
            border-bottom: 1px solid #2f3340;
            color: var(--text);
        }

        .log {
            background: #111;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            border: 1px solid var(--border);
        }

        .log-item {
            margin: 5px 0;
        }

        .log-success {
            color: var(--ok);
        }

        .log-error {
            color: var(--danger);
        }

        .log-info {
            color: var(--highlight);
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: var(--card);
            color: var(--text);
            border-radius: 12px;
            text-decoration: none;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .back-btn:hover {
            background: #2a2a2a;
        }
    </style>
</head>

<body>
    <a href="SteelMaterial.html" class="back-btn">← 返回主畫面</a>

    <div class="container">
        <h1>📋 匯入圖面清單</h1>
        <p class="subtitle">將 Google Drive 圖面清單 CSV 匯入到 Supabase</p>

        <!-- 步驟 1: 上傳 CSV -->
        <div class="step">
            <div class="step-title">步驟 1: 選擇 CSV 檔案</div>
            <div class="file-input-wrapper">
                <input type="file" id="csvFile" class="file-input" accept=".csv" onchange="handleFileSelect(event)">
                <label for="csvFile" class="file-label">
                    📁 點擊選擇 CSV 檔案<br>
                    <small style="color: #aaa;">需包含: file_name, file_id, preview_url, cleaned_key</small>
                </label>
            </div>
            <div id="fileName" class="file-name"></div>
        </div>

        <!-- 步驟 2: 預覽資料 -->
        <div class="step" id="previewSection" style="display: none;">
            <div class="step-title">步驟 2: 預覽資料</div>
            <div>共 <span id="recordCount">0</span> 筆記錄</div>
            <div class="preview" id="preview"></div>
        </div>

        <!-- 步驟 3: 匯入 -->
        <div class="step" id="importSection" style="display: none;">
            <div class="step-title">步驟 3: 匯入到 Supabase</div>
            <button id="importBtn" class="btn" onclick="importToSupabase()">開始匯入</button>
            <div class="log" id="log" style="display: none;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="back.js"></script>
    <script>
        const db = window.supabaseClient;
        let parsedData = [];

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('fileName').textContent = `已選擇: ${file.name}`;

            // 使用 PapaParse 解析 CSV
            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function (results) {
                    parsedData = results.data;
                    displayPreview(parsedData);
                },
                error: function (error) {
                    alert('CSV 解析錯誤: ' + error.message);
                }
            });
        }

        function displayPreview(data) {
            if (data.length === 0) {
                alert('CSV 檔案是空的');
                return;
            }

            // 顯示記錄數
            document.getElementById('recordCount').textContent = data.length;

            // 建立預覽表格
            const headers = Object.keys(data[0]);
            let tableHTML = '<table class="preview-table"><thead><tr>';

            headers.forEach(header => {
                tableHTML += `<th>${header}</th>`;
            });
            tableHTML += '</tr></thead><tbody>';

            // 只顯示前 10 筆
            data.slice(0, 10).forEach(row => {
                tableHTML += '<tr>';
                headers.forEach(header => {
                    const value = row[header] || '';
                    const displayValue = value.length > 50 ? value.substring(0, 50) + '...' : value;
                    tableHTML += `<td>${displayValue}</td>`;
                });
                tableHTML += '</tr>';
            });

            if (data.length > 10) {
                tableHTML += `<tr><td colspan="${headers.length}" style="text-align: center; color: #aaa;">... 還有 ${data.length - 10} 筆資料</td></tr>`;
            }

            tableHTML += '</tbody></table>';
            document.getElementById('preview').innerHTML = tableHTML;

            // 顯示預覽和匯入區塊
            document.getElementById('previewSection').style.display = 'block';
            document.getElementById('importSection').style.display = 'block';
        }

        function addLog(message, type = 'info') {
            const logDiv = document.getElementById('log');
            logDiv.style.display = 'block';
            const logItem = document.createElement('div');
            logItem.className = `log-item log-${type}`;
            logItem.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(logItem);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function importToSupabase() {
            if (!db) {
                alert('Supabase 連線失敗');
                return;
            }

            if (parsedData.length === 0) {
                alert('沒有資料可以匯入');
                return;
            }

            const importBtn = document.getElementById('importBtn');
            importBtn.disabled = true;
            importBtn.textContent = '匯入中...';

            addLog(`開始匯入 ${parsedData.length} 筆資料`, 'info');

            let successCount = 0;
            let errorCount = 0;

            // 批次匯入，每次 50 筆
            const batchSize = 50;
            for (let i = 0; i < parsedData.length; i += batchSize) {
                const batch = parsedData.slice(i, i + batchSize);

                // 轉換資料格式
                const formattedBatch = batch.map(row => ({
                    file_name: row.file_name || row.File_Name || '',
                    file_id: row.file_id || row.File_ID || '',
                    preview_url: row.preview_url || row.Preview_URL || '',
                    cleaned_key: row.cleaned_key || row.Cleaned_Key || ''
                }));

                try {
                    const { data, error } = await db
                        .from('drawings')
                        .upsert(formattedBatch, { onConflict: 'file_id' });

                    if (error) {
                        addLog(`批次 ${Math.floor(i / batchSize) + 1} 失敗: ${error.message}`, 'error');
                        errorCount += batch.length;
                    } else {
                        successCount += batch.length;
                        addLog(`批次 ${Math.floor(i / batchSize) + 1} 成功 (${batch.length} 筆)`, 'success');
                    }
                } catch (err) {
                    addLog(`批次 ${Math.floor(i / batchSize) + 1} 異常: ${err.message}`, 'error');
                    errorCount += batch.length;
                }
            }

            addLog(`匯入完成！成功: ${successCount} 筆，失敗: ${errorCount} 筆`, successCount > 0 ? 'success' : 'error');

            importBtn.disabled = false;
            importBtn.textContent = '重新匯入';
            importBtn.className = 'btn btn-success';
        }
    </script>
</body>

</html>
