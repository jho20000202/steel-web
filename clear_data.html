<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統資料清理工具</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            padding: 40px;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }

        .warning-box {
            background: rgba(207, 48, 48, 0.1);
            border: 2px solid var(--danger);
            padding: 30px;
            border-radius: 20px;
            max-width: 600px;
            text-align: center;
        }

        .warning-title {
            color: var(--danger);
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .warning-text {
            color: var(--text);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }

        .btn-danger:hover {
            background: #c82333;
            transform: scale(1.05);
        }

        .back-link {
            margin-top: 20px;
            color: var(--muted);
            text-decoration: none;
        }

        .log-area {
            margin-top: 20px;
            width: 100%;
            text-align: left;
            background: #000;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            color: var(--ok);
            display: none;
        }
    </style>
</head>

<body>

    <div class="warning-box">
        <div class="warning-title">⚠️ 危險操作：清除所有構件資料</div>
        <div class="warning-text">
            此操作將會<strong>永久刪除</strong>以下資料表的所有內容：<br>
            1. 構件庫 (components)<br>
            2. 預計進料 (planned)<br>
            3. 已進料 (confirm)<br>
            4. 已吊裝 (finished)<br>
            <br>
            <span style="color: #4cd964;">✓ 圖面資料 (drawings, construction_drawings) 將會被保留。</span>
        </div>
        <button class="btn-danger" onclick="clearAllData()">🗑️ 確認清除所有資料</button>
        <div id="logArea" class="log-area"></div>
    </div>

    <a href="index.html" class="back-link">返回首頁</a>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <script src="back.js"></script>
    <script>
        const db = window.supabaseClient;

        function log(msg) {
            const area = document.getElementById('logArea');
            area.style.display = 'block';
            area.innerHTML += `> ${msg}<br>`;
        }

        async function clearAllData() {
            if (!confirm('請再次確認：您真的要刪除所有構件資料嗎？此動作無法復原！')) return;
            if (!confirm('最後警告：圖面資料會保留，但所有進度與構件清單都會消失。輸入 "delete" 確認執行：') === 'delete') return; // Simple check, browser prompt returns text? No, confirm returns bool. Let's use standard confirm twice.

            // Re-implement double check properly
            const check = prompt('請輸入 "delete" 來確認刪除：');
            if (check !== 'delete') {
                alert('取消操作');
                return;
            }

            const btn = document.querySelector('.btn-danger');
            btn.disabled = true;
            btn.textContent = '正在清理...';

            try {
                // DELETE logic: .neq('item_id', '_____') is a trick to match matches all non-nulls. 
                // Assuming item_id is never '_____'

                log('正在刪除 finished 表...');
                const { error: err1 } = await db.from('finished').delete().neq('item_id', '_____');
                if (err1) throw err1;
                log('finished 表已清空');

                log('正在刪除 confirm 表...');
                const { error: err2 } = await db.from('confirm').delete().neq('item_id', '_____');
                if (err2) throw err2;
                log('confirm 表已清空');

                log('正在刪除 planned 表...');
                const { error: err3 } = await db.from('planned').delete().neq('item_id', '_____');
                if (err3) throw err3;
                log('planned 表已清空');

                log('正在刪除 components 表...');
                const { error: err4 } = await db.from('components').delete().neq('item_id', '_____');
                if (err4) throw err4;
                log('components 表已清空');

                log('✅ 所有資料清理完成！');
                alert('清理完成！');
                btn.textContent = '清理完成';
                btn.style.background = '#28a745';

            } catch (err) {
                console.error(err);
                log('❌ 發生錯誤: ' + err.message);
                alert('發生錯誤：' + err.message);
                btn.disabled = false;
                btn.textContent = '重試';
            }
        }
    </script>
</body>

</html>
