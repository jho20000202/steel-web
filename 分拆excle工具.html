<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>構件分拆工具</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            padding: 20px;
            background: var(--bg);
            color: var(--text);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--highlight);
        }

        .back-btn {
            padding: 10px 20px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: #2a2a2a;
        }

        .tool-container {
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border);
            max-width: 800px;
            margin: 0 auto;
        }

        .instruction {
            background: rgba(195, 164, 14, 0.1);
            border: 1px solid var(--primary);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            color: var(--text);
            line-height: 1.6;
        }

        .instruction-title {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(195, 164, 14, 0.05);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .upload-text {
            color: var(--muted);
            font-size: 16px;
        }

        .primary-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            border-radius: 12px;
            color: #000;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
            margin-top: 12px;
        }

        .primary-btn:hover {
            background: #d4b520;
        }

        .primary-btn:disabled {
            background: #444;
            cursor: not-allowed;
            color: #888;
        }

        .result-section {
            margin-top: 24px;
            padding: 16px;
            background: #252525;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .result-title {
            font-weight: bold;
            color: var(--highlight);
            margin-bottom: 12px;
            font-size: 18px;
        }

        .result-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-item {
            background: var(--card);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .stat-label {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 4px;
        }

        .stat-value {
            color: var(--primary);
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="header-row">
        <div class="header-title">構件分拆工具</div>
        <a href="index.html" class="back-btn">返回主畫面</a>
    </div>

    <div class="tool-container">
        <div class="instruction">
            <div class="instruction-title">📋 使用說明</div>
            <ul style="margin: 8px 0; padding-left: 20px;">
                <li>上傳包含構件資料的 Excel 檔案</li>
                <li>系統會自動將數量 > 1 的構件分拆成多個數量為 1 的記錄</li>
                <li>例如：1 個數量為 5 的構件 → 5 個數量為 1 的構件</li>
                <li>分拆後可下載新的 Excel 檔案</li>
            </ul>
        </div>

        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">📁</div>
            <div class="upload-text">點擊選擇 Excel 檔案</div>
            <div class="upload-text" style="font-size: 13px; margin-top: 8px; color: #666;">支援 .xlsx 和 .xls 格式</div>
        </div>

        <input type="file" id="fileInput" accept=".xlsx, .xls" style="display: none;" onchange="handleFileUpload(this)">

        <div id="resultSection" style="display: none;" class="result-section">
            <div class="result-title">分拆結果</div>
            <div class="result-stats">
                <div class="stat-item">
                    <div class="stat-label">原始構件數</div>
                    <div class="stat-value" id="originalCount">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">分拆後構件數</div>
                    <div class="stat-value" id="splitCount">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">增加數量</div>
                    <div class="stat-value" id="increaseCount" style="color: var(--ok);">0</div>
                </div>
            </div>
            <button class="primary-btn" onclick="downloadResult()">下載分拆後的 Excel</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        let splitData = [];

        function handleFileUpload(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet);

                    if (jsonData.length === 0) {
                        alert('Excel 檔案內容為空');
                        input.value = '';
                        return;
                    }

                    // Split components
                    splitData = [];
                    let originalCount = jsonData.length;

                    jsonData.forEach(row => {
                        const qty = Number(row['構件數量'] || row['數量'] || row['Qty'] || row['qty']) || 1;

                        if (qty > 1) {
                            // Split into multiple rows with qty = 1
                            for (let i = 0; i < qty; i++) {
                                splitData.push({
                                    '構件編號': row['構件編號'] || row['編號'] || row['Item ID'] || row['item_id'] || '',
                                    '規格': row['構件規格'] || row['規格'] || row['Spec'] || row['spec'] || '',
                                    '材質': row['構件材質'] || row['材質'] || row['Material'] || row['material'] || '',
                                    '重量': Number(row['構件重量'] || row['重量'] || row['Weight'] || row['weight']) || 0,
                                    '位置': row['構件位置'] || row['位置'] || row['Position'] || row['position'] || '',
                                    '數量': 1
                                });
                            }
                        } else {
                            // Keep as is
                            splitData.push({
                                '構件編號': row['構件編號'] || row['編號'] || row['Item ID'] || row['item_id'] || '',
                                '規格': row['構件規格'] || row['規格'] || row['Spec'] || row['spec'] || '',
                                '材質': row['構件材質'] || row['材質'] || row['Material'] || row['material'] || '',
                                '重量': Number(row['構件重量'] || row['重量'] || row['Weight'] || row['weight']) || 0,
                                '位置': row['構件位置'] || row['位置'] || row['Position'] || row['position'] || '',
                                '數量': 1
                            });
                        }
                    });

                    // Show results
                    document.getElementById('originalCount').textContent = originalCount;
                    document.getElementById('splitCount').textContent = splitData.length;
                    document.getElementById('increaseCount').textContent = '+' + (splitData.length - originalCount);
                    document.getElementById('resultSection').style.display = 'block';

                    input.value = '';
                } catch (err) {
                    alert('Excel 解析失敗：' + err.message);
                    console.error(err);
                    input.value = '';
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function downloadResult() {
            if (splitData.length === 0) {
                alert('沒有資料可下載');
                return;
            }

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(splitData);
            XLSX.utils.book_append_sheet(wb, ws, '分拆後構件');

            const timestamp = new Date().toISOString().split('T')[0];
            XLSX.writeFile(wb, `構件分拆結果_${timestamp}.xlsx`);
        }
    </script>
    <script src="backToTop.js"></script>
</body>

</html>
