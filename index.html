<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皆豪工程管理系統</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f1320 0%, #1a2332 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .top-bar {
            background: #1c2433;
            padding: 16px 24px;
            border-bottom: 1px solid #2f3340;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-bar-title {
            font-size: 20px;
            font-weight: 700;
        }

        .back-btn {
            padding: 8px 20px;
            background: #2f3340;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: #3e4452;
        }

        .container {
            max-width: 1200px;
            width: 90%;
            margin: 0 auto;
            padding: 40px 20px;
            flex: 1;
        }

        .page-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .page-title {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #3d7bff 0%, #5a9dff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-subtitle {
            font-size: 16px;
            color: #aaa;
        }

        .system-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 40px;
        }

        .system-card {
            background: #1c2433;
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .system-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(61, 123, 255, 0.1) 0%, rgba(90, 157, 255, 0.05) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .system-card:hover::before {
            opacity: 1;
        }

        .system-card:hover {
            transform: translateY(-6px);
            border-color: #3d7bff;
            box-shadow: 0 15px 30px rgba(61, 123, 255, 0.2);
        }

        .system-card.active {
            cursor: pointer;
        }

        .system-card.coming-soon {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .system-card.coming-soon:hover {
            transform: translateY(-3px);
            border-color: #555;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        .system-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .system-desc {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }

        .status-active {
            background: rgba(61, 123, 255, 0.2);
            color: #3d7bff;
        }

        .status-coming {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }

        .status-in-progress {
            background: rgba(255, 152, 0, 0.2);
            color: #ff9800;
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .page-title {
                font-size: 28px;
            }

            .system-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .system-card {
                padding: 24px;
            }

            .system-name {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="page-header">
            <h1 class="page-title">皆豪工程管理系統</h1>

        </div>

        <div class="system-grid">
            <!-- 鋼構進出料記錄系統 -->
            <div class="system-card active" onclick="window.location.href='SteelMaterial.html'">
                <div class="system-name">鋼構進出料記錄系統</div>

                <span class="status-badge status-active">● 已啟用</span>
            </div>

            <!-- 施工圖面 -->
            <div class="system-card active" onclick="window.location.href='ConstructionZoneSelection.html'">
                <div class="system-name">施工圖面</div>

                <span class="status-badge status-active">● 已啟用</span>
            </div>

            <!-- 機具管理 -->
            <div class="system-card active">
                <div class="system-name">機具管理</div>

                <span class="status-badge status-in-progress">製作中</span>
            </div>

            <!-- 電焊管理 -->
            <div class="system-card coming-soon">
                <div class="system-name">電焊管理</div>

                <span class="status-badge status-coming">Coming Soon</span>
            </div>

            <!-- 防火漆管理 -->
            <div class="system-card coming-soon">
                <div class="system-name">防火漆管理</div>

                <span class="status-badge status-coming">Coming Soon</span>
            </div>
            <!-- 品質管理 -->
            <div class="system-card coming-soon">
                <div class="system-name">品質管理</div>
                <span class="status-badge status-coming">Coming Soon</span>
            </div>
        </div>
    </div>

    <script>
        // 防止點擊 coming soon 卡片
        document.querySelectorAll('.coming-soon').forEach(card => {
            card.addEventListener('click', (e) => {
                e.preventDefault();
                alert('！');
            });
        });
    </script>
</body>

</html>
