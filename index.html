<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皆豪工程管理系統</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .container {
            max-width: 1200px;
            width: 90%;
            margin: 0 auto;
            padding: 40px 20px;
            flex: 1;
        }

        .page-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .logo-img {
            height: 80px;
            margin-bottom: 16px;
        }

        .page-title {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 12px;
            color: var(--highlight);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .system-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 40px;
        }

        .system-card {
            background: var(--card);
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .system-card:hover {
            transform: translateY(-6px);
            border-color: var(--primary);
            box-shadow: 0 15px 30px rgba(195, 164, 14, 0.15);
            /* Gold shadow */
        }

        .system-card.active {
            cursor: pointer;
        }

        .system-card.coming-soon {
            cursor: not-allowed;
            opacity: 0.6;
            border-color: #333;
        }

        .system-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text);
        }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
        }

        .status-active {
            background: rgba(195, 164, 14, 0.2);
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .status-coming {
            background: rgba(100, 100, 100, 0.2);
            color: var(--muted);
            border: 1px solid #444;
        }

        .status-in-progress {
            background: rgba(233, 211, 84, 0.2);
            color: var(--highlight);
            border: 1px solid var(--highlight);
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .page-title {
                font-size: 28px;
            }

            .system-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .system-card {
                padding: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="page-header">
            <img src="logo.png" alt="Logo" class="logo-img">
            <h1 class="page-title">皆豪工程管理系統</h1>
        </div>

        <div class="system-grid">
            <!-- 鋼構進出料記錄系統 -->
            <div class="system-card active" onclick="window.location.href='SteelMaterial.html'">
                <div class="system-name">鋼構進出料記錄系統</div>
                <span class="status-badge status-active">● 已啟用</span>
            </div>

            <!-- 施工圖面 -->
            <div class="system-card active" onclick="window.location.href='ConstructionZoneSelection.html'">
                <div class="system-name">施工圖面</div>
                <span class="status-badge status-active">● 已啟用</span>
            </div>

            <!-- 機具管理 -->
            <div class="system-card active">
                <div class="system-name">機具管理</div>
                <span class="status-badge status-in-progress">製作中</span>
            </div>

            <!-- 電焊管理 -->
            <div class="system-card coming-soon">
                <div class="system-name">電焊管理</div>
                <span class="status-badge status-coming">Coming Soon</span>
            </div>

            <!-- 防火漆管理 -->
            <div class="system-card coming-soon">
                <div class="system-name">防火漆管理</div>
                <span class="status-badge status-coming">Coming Soon</span>
            </div>

            <!-- 品質管理 -->
            <div class="system-card coming-soon">
                <div class="system-name">品質管理</div>
                <span class="status-badge status-coming">Coming Soon</span>
            </div>
        </div>
    </div>

    <script>
        // 防止點擊 coming soon 卡片
        document.querySelectorAll('.coming-soon').forEach(card => {
            card.addEventListener('click', (e) => {
                e.preventDefault();
                alert('！');
            });
        });
    </script>
</body>

</html>
