<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>預計進料登記</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="mobile.css">
    <style>
        body {
            padding: 20px;
            background: var(--bg);
            color: var(--text);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--highlight);
        }

        .back-btn {
            padding: 10px 20px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: #2a2a2a;
        }

        .form-section {
            background: var(--card);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 13px;
            color: var(--muted);
        }

        .input-box,
        select {
            padding: 12px;
            border-radius: 10px;
            background: #252525;
            border: 1px solid var(--border);
            color: #fff;
            font-size: 15px;
        }

        .input-box:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .primary-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            border-radius: 12px;
            color: #000;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        .primary-btn:hover {
            background: #d4b520;
        }

        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-id {
            font-size: 18px;
            font-weight: bold;
            color: var(--highlight);
        }

        .card-detail {
            font-size: 14px;
            color: #ccc;
            margin-top: 4px;
        }

        .card-meta {
            color: var(--muted);
        }

        .card-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-confirm {
            padding: 10px 20px;
            background: var(--ok);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
        }

        .btn-confirm:hover {
            background: #218838;
        }

        .btn-delete {
            padding: 10px 20px;
            background: var(--danger);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: var(--card);
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .modal-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 16px;
            color: var(--highlight);
        }

        .modal-content {
            margin-bottom: 24px;
            color: #ccc;
            line-height: 1.5;
            font-size: 16px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn-cancel {
            padding: 10px 20px;
            background: #333;
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-cancel:hover {
            background: #444;
        }

        .btn-confirm-action {
            padding: 10px 20px;
            background: var(--danger);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-confirm-action:hover {
            background: #c82333;
        }

        /* Autocomplete Styles */
        .autocomplete-items {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 99;
            background: var(--card);
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 10px 10px;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .autocomplete-item {
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid #333;
            color: #ddd;
            font-size: 15px;
        }

        .autocomplete-item:hover {
            background: rgba(195, 164, 14, 0.1);
            color: var(--primary);
        }

        .autocomplete-item:last-child {
            border-bottom: none;
        }
    </style>
</head>

<body>
    <div class="header-row">
        <div class="header-title">預計進料登記</div>
        <a href="SteelMaterial.html" class="back-btn">返回主畫面</a>
    </div>
    <div class="form-section">
        <div style="margin-bottom:16px; font-size:16px; font-weight:600;">新增預計進料</div>
        <div class="form-grid">
            <div class="input-group" style="position: relative;">
                <label>構件編號</label>
                <input id="itemId" class="input-box" placeholder="輸入關鍵字搜尋..." autocomplete="off">
                <div id="autocomplete-list" class="autocomplete-items"></div>
            </div>
            <div class="input-group">
                <label>構件位置 <span style="color: var(--muted); font-size: 11px;">(留空則自動分配)</span></label>
                <select id="position" class="input-box">
                    <option value="">自動分配</option>
                </select>
                <div id="availableCount" style="font-size: 12px; color: var(--muted); margin-top: 4px;"></div>
            </div>
            <div class="input-group">
                <label>預計進料日期</label>
                <input id="plannedDate" type="date" class="input-box">
            </div>
            <div class="input-group">
                <label>數量</label>
                <input id="qty" type="number" class="input-box" placeholder="數量" value="1" min="1">
            </div>
        </div>
        <button class="primary-btn" onclick="addPlannedItem()">登記預計進料</button>
    </div>
    <div style="margin-bottom: 12px;">
        <input type="text" id="searchBox" class="input-box" style="width: 100%;" placeholder="搜尋預計進料 (構件編號)..."
            oninput="renderCards()">
    </div>
    <div class="cards-container" id="cardsContainer"></div>

    <!-- Custom Confirmation Modal -->
    <div id="confirmModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-title">確認刪除</div>
            <div class="modal-content" id="modalMessage"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-confirm-action" onclick="executeDelete()">確定刪除</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <script src="back.js"></script>
    <script>
        const db = window.supabaseClient;
        let allComponents = [];
        let plannedItems = [];
        let deleteTarget = null;

        // Modal Functions
        function showDeleteModal(id, itemId, position) {
            deleteTarget = { id, itemId, position };
            document.getElementById('modalMessage').textContent = `確定要刪除 ${itemId} (${position}) 的預計進料登記嗎？`;
            document.getElementById('confirmModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('confirmModal').style.display = 'none';
            deleteTarget = null;
        }

        async function executeDelete() {
            if (!deleteTarget) return;
            const { id, itemId, position } = deleteTarget;

            // Change button text to indicate loading
            const confirmBtn = document.querySelector('.btn-confirm-action');
            const originalText = confirmBtn.textContent;
            confirmBtn.textContent = '刪除中...';
            confirmBtn.disabled = true;

            try {
                const { error } = await db.from('planned')
                    .delete()
                    .eq('item_id', itemId)
                    .eq('position', position);

                if (error) {
                    console.error('Delete error:', error);
                    alert('刪除失敗：' + error.message);
                } else {
                    // alert('✅ 刪除成功！'); // Optional: remove alert for smoother UX
                    await loadAllData();
                }
            } catch (err) {
                console.error('Delete exception:', err);
                alert('刪除失敗：' + err.message);
            } finally {
                confirmBtn.textContent = originalText;
                confirmBtn.disabled = false;
                closeModal();
            }
        }

        // Main Functions
        async function confirmItem(event, id, itemId, position, plannedDate, qty) {
            // Optimistic UI: Hide card immediately to speed up user flow
            const btn = document.getElementById(`confirm-${id}`);
            const card = btn ? btn.closest('.card') : null;

            if (card) {
                card.style.display = 'none';
            }

            try {
                const { error: updateError } = await db.from('planned')
                    .update({ received_at: new Date().toISOString() })
                    .eq('id', id);

                if (updateError) throw new Error('更新簽收時間失敗：' + updateError.message);

                const { error: confirmError } = await db.from('confirm').insert([{
                    item_id: itemId,
                    position: position,
                    planned_date: plannedDate,
                    qty: qty
                }]);

                if (confirmError) throw new Error('新增至確認簽收表失敗：' + confirmError.message);

                // Success: Do nothing (Item is already hidden)

            } catch (err) {
                console.error(err);
                alert(err.message);
                // Revert UI on error
                if (card) {
                    card.style.display = 'flex';
                }
            }
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            const searchTerm = document.getElementById('searchBox') ? document.getElementById('searchBox').value.trim().toUpperCase() : '';

            // Filter items based on search
            const filteredItems = plannedItems.filter(item => {
                return !searchTerm || item.item_id.toUpperCase().includes(searchTerm);
            });

            if (filteredItems.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#777; padding:40px;">${searchTerm ? '找不到符合搜尋的預計進料' : '尚無預計進料登記'}</div>`;
                return;
            }

            filteredItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div style="flex: 1;">
                        <div class="card-id">${item.item_id} - ${item.position}</div>
                        <div class="card-detail"><span class="card-meta">日期:</span> ${item.planned_date} | <span class="card-meta">數量:</span> ${item.qty}</div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-confirm" id="confirm-${item.id}" onclick="confirmItem(event, '${item.id}', '${item.item_id}', '${item.position}', '${item.planned_date}', ${item.qty})">✓ 確認簽收</button>
                        <button class="btn-delete" onclick="showDeleteModal('${item.id}', '${item.item_id}', '${item.position}')">✕ 刪除</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function loadAllData() {
            if (!db) return;
            const currentSite = localStorage.getItem('selectedSite') || '南亞5A';
            const { data: components, error: compError } = await db.from('components').select('*').eq('site_name', currentSite).range(0, 99999);
            if (compError) { console.error('Error loading components:', compError); return; }
            allComponents = components || [];
            await loadPlannedItems();
        }

        async function loadPlannedItems() {
            const currentSite = localStorage.getItem('selectedSite') || '南亞5A';
            const { data, error } = await db.from('planned')
                .select('*')
                .eq('site_name', currentSite)
                .is('received_at', null)
                .order('created_at', { ascending: true }); // Sort by creation time (registration order)
            if (error) { console.error('Error loading planned items:', error); return; }
            plannedItems = data || [];
            renderCards();
        }

        async function loadPositions() {
            const itemId = document.getElementById('itemId').value.trim().toUpperCase();
            const positionSelect = document.getElementById('position');
            positionSelect.innerHTML = '<option value="">載入中...</option>';

            if (!itemId) {
                positionSelect.innerHTML = '<option value="">請先選擇構件編號</option>';
                return;
            }

            const availablePositions = allComponents
                .filter(c => c.item_id === itemId)
                .map(c => c.position)
                .filter(p => p);

            if (availablePositions.length === 0) {
                positionSelect.innerHTML = '<option value="">找不到此構件編號</option>';
                return;
            }

            // 獲取所有已使用的位置（從 planned, confirm, finished 三個表）
            const [plannedRes, confirmRes, finishedRes] = await Promise.all([
                db.from('planned').select('position').eq('item_id', itemId),
                db.from('confirm').select('position').eq('item_id', itemId),
                db.from('finished').select('position').eq('item_id', itemId)
            ]);

            const usedPositions = new Set([
                ...(plannedRes.data || []).map(p => p.position),
                ...(confirmRes.data || []).map(p => p.position),
                ...(finishedRes.data || []).map(p => p.position)
            ]);

            const unusedPositions = availablePositions.filter(p => !usedPositions.has(p));

            if (unusedPositions.length === 0) {
                positionSelect.innerHTML = '<option value="">所有位置已登記</option>';
                return;
            }

            positionSelect.innerHTML = '<option value="">請選擇位置</option>';
            unusedPositions.forEach(pos => {
                const option = document.createElement('option');
                option.value = pos;
                option.textContent = pos;
                positionSelect.appendChild(option);
            });
        }

        async function addPlannedItem() {
            const itemId = document.getElementById('itemId').value.trim().toUpperCase();
            const plannedDate = document.getElementById('plannedDate').value;
            const qty = parseInt(document.getElementById('qty').value);

            if (!itemId || !plannedDate || !qty || qty < 1) {
                alert('請填寫構件編號、預計日期和數量');
                return;
            }

            const currentSite = localStorage.getItem('selectedSite') || '南亞5A';

            // Get all positions for this item_id in components
            const allPositionsForItem = allComponents.filter(c => c.item_id === itemId && c.site_name === currentSite);

            if (allPositionsForItem.length === 0) {
                alert(`構件編號 ${itemId} 不存在於 ${currentSite} 的構件庫中`);
                return;
            }

            // Get already registered positions from planned, confirm, and finished
            const [plannedRes, confirmRes, finishedRes] = await Promise.all([
                db.from('planned').select('position').eq('item_id', itemId).eq('site_name', currentSite),
                db.from('confirm').select('position').eq('item_id', itemId).eq('site_name', currentSite),
                db.from('finished').select('position').eq('item_id', itemId).eq('site_name', currentSite)
            ]);

            const registeredPositions = new Set([
                ...(plannedRes.data || []).map(p => p.position),
                ...(confirmRes.data || []).map(p => p.position),
                ...(finishedRes.data || []).map(p => p.position)
            ]);

            // Find available (unregistered) positions
            const availablePositions = allPositionsForItem
                .filter(c => !registeredPositions.has(c.position))
                .map(c => c.position)
                .sort(); // Sort for consistent assignment

            if (availablePositions.length === 0) {
                alert(`構件編號 ${itemId} 的所有位置都已登記完畢`);
                return;
            }

            if (qty > availablePositions.length) {
                alert(`構件編號 ${itemId} 只有 ${availablePositions.length} 個未登記位置，但您輸入了 ${qty} 個數量\n\n可用位置數量不足`);
                return;
            }

            // Assign first 'qty' available positions
            const positionsToAssign = availablePositions.slice(0, qty);

            // Insert all assigned positions
            const itemsToInsert = positionsToAssign.map(position => ({
                item_id: itemId,
                position: position,
                planned_date: plannedDate,
                qty: 1, // Each position gets qty=1
                site_name: currentSite
            }));

            const { error } = await db.from('planned').insert(itemsToInsert);

            if (error) {
                console.error('Insert error:', error);
                alert('登記失敗：' + error.message);
                return;
            }

            alert(`✅ 登記成功！\n\n已自動分配 ${qty} 個位置：\n${positionsToAssign.join(', ')}`);

            document.getElementById('itemId').value = '';
            document.getElementById('qty').value = '1';
            document.getElementById('availableCount').textContent = '';
            await loadAllData();
        }

        // Function to update available position count display
        async function updateAvailableCount(itemId) {
            const currentSite = localStorage.getItem('selectedSite') || '南亞5A';
            const allPositionsForItem = allComponents.filter(c => c.item_id === itemId && c.site_name === currentSite);

            if (allPositionsForItem.length === 0) {
                document.getElementById('availableCount').textContent = '此構件編號不存在';
                document.getElementById('availableCount').style.color = 'var(--error)';
                return;
            }

            const [plannedRes, confirmRes, finishedRes] = await Promise.all([
                db.from('planned').select('position').eq('item_id', itemId).eq('site_name', currentSite),
                db.from('confirm').select('position').eq('item_id', itemId).eq('site_name', currentSite),
                db.from('finished').select('position').eq('item_id', itemId).eq('site_name', currentSite)
            ]);

            const registeredPositions = new Set([
                ...(plannedRes.data || []).map(p => p.position),
                ...(confirmRes.data || []).map(p => p.position),
                ...(finishedRes.data || []).map(p => p.position)
            ]);

            const availableCount = allPositionsForItem.length - registeredPositions.size;

            if (availableCount > 0) {
                document.getElementById('availableCount').textContent = `可用位置：${availableCount} / ${allPositionsForItem.length}`;
                document.getElementById('availableCount').style.color = 'var(--ok)';
            } else {
                document.getElementById('availableCount').textContent = '所有位置已登記完畢';
                document.getElementById('availableCount').style.color = 'var(--error)';
            }
        }

        // Function to load available positions for selected component ID
        async function loadPositions() {
            const itemId = document.getElementById('itemId').value.trim().toUpperCase();
            const positionSelect = document.getElementById('position');

            // Reset to auto-assign
            positionSelect.innerHTML = '<option value="">自動分配</option>';

            if (!itemId) {
                document.getElementById('availableCount').textContent = '';
                return;
            }

            const currentSite = localStorage.getItem('selectedSite') || '南亞5A';
            const allPositionsForItem = allComponents.filter(c => c.item_id === itemId && c.site_name === currentSite);

            if (allPositionsForItem.length === 0) {
                document.getElementById('availableCount').textContent = '此構件編號不存在';
                document.getElementById('availableCount').style.color = 'var(--error)';
                return;
            }

            // Get registered positions
            const [plannedRes, confirmRes, finishedRes] = await Promise.all([
                db.from('planned').select('position').eq('item_id', itemId).eq('site_name', currentSite),
                db.from('confirm').select('position').eq('item_id', itemId).eq('site_name', currentSite),
                db.from('finished').select('position').eq('item_id', itemId).eq('site_name', currentSite)
            ]);

            const registeredPositions = new Set([
                ...(plannedRes.data || []).map(p => p.position),
                ...(confirmRes.data || []).map(p => p.position),
                ...(finishedRes.data || []).map(p => p.position)
            ]);

            // Populate dropdown with all positions (mark registered ones)
            allPositionsForItem.forEach(c => {
                const option = document.createElement('option');
                option.value = c.position;
                const isRegistered = registeredPositions.has(c.position);
                option.textContent = isRegistered ? `${c.position} (已登記)` : c.position;
                option.disabled = isRegistered;
                option.style.color = isRegistered ? 'var(--muted)' : 'var(--text)';
                positionSelect.appendChild(option);
            });

            // Update available count
            const availableCount = allPositionsForItem.length - registeredPositions.size;
            if (availableCount > 0) {
                document.getElementById('availableCount').textContent = `可用位置：${availableCount} / ${allPositionsForItem.length}`;
                document.getElementById('availableCount').style.color = 'var(--ok)';
            } else {
                document.getElementById('availableCount').textContent = '所有位置已登記完畢';
                document.getElementById('availableCount').style.color = 'var(--error)';
            }
        }

        const DATE_STORAGE_KEY = 'steel_planned_date';

        // Listen for date changes
        document.getElementById('plannedDate').addEventListener('change', (e) => {
            localStorage.setItem(DATE_STORAGE_KEY, e.target.value);
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadAllData();

            // Restore date from storage or default to today
            const savedDate = localStorage.getItem(DATE_STORAGE_KEY);
            if (savedDate) {
                document.getElementById('plannedDate').value = savedDate;
            } else {
                document.getElementById('plannedDate').valueAsDate = new Date();
            }

            // Autocomplete Setup
            const input = document.getElementById("itemId");
            const list = document.getElementById("autocomplete-list");

            input.addEventListener("input", function (e) {
                const val = this.value;
                list.innerHTML = '';
                if (!val) return;

                // Get unique item_ids from allComponents
                const uniqueIds = [...new Set(allComponents.map(c => c.item_id))];

                // Filter matching IDs (limit to 10 to avoid performance lag)
                const matches = uniqueIds.filter(id => id.toUpperCase().includes(val.toUpperCase())).slice(0, 10);

                if (matches.length === 0) {
                    // Optionally show "No results"
                    return;
                }

                matches.forEach(id => {
                    const item = document.createElement("div");
                    item.className = "autocomplete-item";
                    // Highlight match
                    const regex = new RegExp(`(${val})`, "gi");
                    item.innerHTML = id.replace(regex, '<span style="color:var(--primary); font-weight:bold;">$1</span>');

                    item.addEventListener("click", async function () {
                        input.value = id; // Set full ID
                        list.innerHTML = '';
                        await updateAvailableCount(id); // Show available positions
                    });
                    list.appendChild(item);
                });
            });

            // Close list when clicking outside
            document.addEventListener("click", function (e) {
                if (e.target !== input) {
                    list.innerHTML = '';
                }
            });
        });
    </script>
    <script src="backToTop.js"></script>
</body>

</html>
