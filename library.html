<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>構件庫管理</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="mobile.css">
    <style>
        body {
            padding: 20px;
            background: var(--bg);
            color: var(--text);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--highlight);
        }

        .back-btn {
            padding: 10px 20px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: #2a2a2a;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 13px;
            color: var(--muted);
        }

        .input-box {
            padding: 12px;
            border-radius: 10px;
            background: #252525;
            border: 1px solid var(--border);
            color: #fff;
            font-size: 15px;
        }

        .input-box:focus {
            outline: none;
            border-color: var(--primary);
        }

        .primary-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            border-radius: 12px;
            color: #000;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        .primary-btn:hover {
            background: #d4b520;
        }

        .list-section {
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .search-bar {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px;

        }

        .component-card {
            background: #252525;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: border-color 0.2s;
            cursor: pointer;
        }

        .component-card:hover {
            border-color: var(--primary);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-id {
            font-size: 18px;
            font-weight: bold;
            color: var(--highlight);
        }

        .card-pos {
            font-size: 14px;
            color: var(--muted);
            background: var(--card);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #444;
        }

        .card-details {
            display: none;
            background: var(--card);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            color: var(--text);
            line-height: 1.6;
            margin-top: 8px;
        }

        .card-details.show {
            display: block;
        }

        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .delete-btn {
            background: var(--danger);
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            pointer-events: auto;
            position: relative;
            z-index: 10;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .view-drawing-btn {
            background: #3a3a3a;
            color: var(--highlight);
            border: 1px solid var(--highlight);
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            pointer-events: auto;
            position: relative;
            z-index: 10;
            margin-right: 8px;
        }

        .view-drawing-btn:hover {
            background: #4a4a4a;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 12px;
        }


        .detail-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding: 4px 0;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: var(--muted);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
        }

        .modal-content {
            background: var(--card);
            margin: 5% auto;
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 600px;
            border: 1px solid var(--border);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: bold;
            color: var(--highlight);
        }

        .close-btn {
            font-size: 28px;
            font-weight: bold;
            color: var(--muted);
            cursor: pointer;
        }

        .close-btn:hover {
            color: #fff;
        }

        .drawing-selection-item {
            background: #252b3b;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--border);
        }

        .drawing-selection-item:hover {
            background: #2f3545;
            border-color: var(--primary);
        }

        .drawing-item-name {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        .drawing-item-info {
            font-size: 14px;
            color: var(--muted);
        }
    </style>
</head>

<body>
    <div class="header-row">
        <div class="header-title">構件庫管理</div>
        <a href="SteelMaterial.html" class="back-btn">返回主畫面</a>
    </div>

    <div style="margin-bottom: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
        <button class="primary-btn" style="width: auto; background: var(--primary);" onclick="openModal()">新增構件</button>
        <button class="primary-btn" style="width: auto; background: #28a745;"
            onclick="document.getElementById('excelInput').click()">匯入 Excel</button>
        <button class="primary-btn" style="width: auto; background: #17a2b8;"
            onclick="downloadTemplate()">下載範例格式</button>
        <input type="file" id="excelInput" accept=".xlsx, .xls" style="display: none;"
            onchange="handleExcelUpload(this)">
        <span style="color: #aaa; font-size: 13px;">每次顯示100筆，滾動載入更多</span>
        <span style="color: var(--primary); font-size: 13px; margin-left: 10px;">💡 匯入的構件會自動標記為當前工地</span>
    </div>

    <div id="addModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">新增構件</div>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <div class="form-grid">
                <div class="input-group"><label>構件編號</label><input id="newId" class="input-box" placeholder="例如：C1-101">
                </div>
                <div class="input-group"><label>規格</label><input id="newSpec" class="input-box"
                        placeholder="例如：H-300x150"></div>
                <div class="input-group"><label>材質</label><input id="newMaterial" class="input-box"
                        placeholder="例如：SN490B"></div>
                <div class="input-group"><label>重量 (kg)</label><input id="newWeight" type="number" class="input-box"
                        placeholder="單重"></div>
                <div class="input-group"><label>位置</label><input id="newPos" class="input-box" placeholder="例如：1F-A區">
                </div>
                <div class="input-group"><label>數量</label><input id="newQty" type="number" class="input-box"
                        placeholder="數量" value="1"></div>
            </div>
            <button class="primary-btn" style="margin-top: 16px;" onclick="addItem()">新增至構件庫</button>
        </div>
    </div>

    <div class="list-section">
        <div class="search-bar"><input id="searchInput" class="input-box" style="width:100%;"
                placeholder="搜尋構件編號、規格、位置..."></div>
        <div class="card-list" id="cardList"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="back.js"></script>
    <script>
        const db = window.supabaseClient;
        let allItems = [], filteredItems = [], displayedCount = 0;
        const ITEMS_PER_PAGE = 100;

        document.addEventListener('DOMContentLoaded', () => loadItems());

        function openModal() { document.getElementById('addModal').style.display = 'block'; }
        function closeModal() { document.getElementById('addModal').style.display = 'none'; }
        window.onclick = (e) => { if (e.target == document.getElementById('addModal')) closeModal(); }

        // Global delete handler for inline onclick
        window.handleDelete = async function (id) {
            console.log('Delete requested for ID:', id);
            if (!id || id === 'undefined') {
                alert('錯誤：找不到構件 ID');
                return;
            }

            if (!confirm('確定要刪除此構件嗎？此操作將同時刪除所有相關的進料和吊裝記錄。')) return;

            try {
                // First, get the item_id from components to delete related records
                const { data: componentData, error: fetchError } = await db
                    .from('components')
                    .select('item_id')
                    .eq('id', id)
                    .single();

                if (fetchError || !componentData) {
                    console.error('Failed to fetch component:', fetchError);
                    alert('無法找到該構件資料');
                    return;
                }

                const itemId = componentData.item_id;
                console.log('Deleting component with item_id:', itemId);

                // Delete from all related tables
                const deletePromises = [
                    db.from('components').delete().eq('id', id),
                    db.from('planned').delete().eq('item_id', itemId),
                    db.from('confirm').delete().eq('item_id', itemId),
                    db.from('finished').delete().eq('item_id', itemId)
                ];

                const results = await Promise.all(deletePromises);

                // Check for errors
                const errors = results.filter(r => r.error);
                if (errors.length > 0) {
                    console.error('Delete errors:', errors);
                    alert('部分資料刪除失敗，請檢查控制台查看詳情');
                } else {
                    console.log('All records deleted successfully from all tables');
                    // Reload items
                    loadItems();
                }
            } catch (err) {
                console.error('Delete exception:', err);
                alert('刪除時發生錯誤：' + err.message);
            }
        }

        async function loadItems() {
            if (!db) return;
            const currentSite = localStorage.getItem('selectedSite') || '南亞5A';
            const { data, error } = await db.from('components').select('*').eq('site_name', currentSite).range(0, 99999).order('created_at', { ascending: false });
            if (error) { console.error('Error loading items:', error); return; }
            allItems = data || [];
            filteredItems = allItems;
            displayedCount = 0;
            renderCards(true);
        }

        function renderCards(reset = false) {
            const container = document.getElementById('cardList');
            if (reset) { container.innerHTML = ''; displayedCount = 0; }
            if (filteredItems.length === 0) { container.innerHTML = '<div style="text-align:center; color:#777; padding:30px;">尚無資料</div>'; return; }

            const itemsToShow = filteredItems.slice(displayedCount, displayedCount + ITEMS_PER_PAGE);
            itemsToShow.forEach(item => {
                const card = document.createElement('div');
                card.className = 'component-card';

                // Check for ID
                if (!item.id) console.warn('Item missing ID:', item);

                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-id">${item.item_id}</div>
                        <div class="card-pos">${item.position || '未指定位置'}</div>
                    </div>
                    <div class="card-actions">
                        <span style="color: #aaa; font-size: 14px;">數量: ${item.qty || 0}</span>
                    </div>
                    <div class="card-details">
                        <div class="detail-row"><span class="detail-label">規格</span><span>${item.spec || '-'}</span></div>
                        <div class="detail-row"><span class="detail-label">材質</span><span>${item.material || '-'}</span></div>
                        <div class="detail-row"><span class="detail-label">重量</span><span>${item.weight || 0} kg</span></div>
                        <div class="btn-group">
                            <button class="view-drawing-btn" onclick="event.stopPropagation(); viewDrawing('${item.item_id}')">📋 查看圖面</button>
                            <button class="delete-btn" onclick="event.stopPropagation(); window.handleDelete('${item.id}')">刪除構件</button>
                        </div>
                    </div>
                `;

                // Add click handler to card for toggling details
                card.addEventListener('click', (e) => {
                    // If clicking the delete button or its children, do not toggle
                    if (e.target.closest('.delete-btn')) return;

                    const details = card.querySelector('.card-details');
                    details.classList.toggle('show');
                });

                container.appendChild(card);
            });
            displayedCount += itemsToShow.length;

            const oldLoading = document.getElementById('loadingMsg');
            if (oldLoading) oldLoading.remove();
            if (displayedCount < filteredItems.length) {
                const loadingMsg = document.createElement('div');
                loadingMsg.id = 'loadingMsg';
                loadingMsg.style.textAlign = 'center';
                loadingMsg.style.color = '#aaa';
                loadingMsg.style.padding = '20px';
                loadingMsg.innerText = `滾動載入更多... (${displayedCount}/${filteredItems.length})`;
                container.appendChild(loadingMsg);
            }
        }

        window.addEventListener('scroll', () => {
            if (displayedCount >= filteredItems.length) return;
            const scrollPosition = window.innerHeight + window.scrollY;
            const pageHeight = document.documentElement.scrollHeight;
            if (scrollPosition >= pageHeight - 200) renderCards(false);
        });

        async function addItem() {
            const id = document.getElementById('newId').value.trim();
            if (!id) { alert('請輸入構件編號'); return; }
            const currentSite = localStorage.getItem('selectedSite') || '南亞5A';
            const newItem = {
                item_id: id,
                spec: document.getElementById('newSpec').value.trim(),
                material: document.getElementById('newMaterial').value.trim(),
                weight: Number(document.getElementById('newWeight').value.trim()) || 0,
                position: document.getElementById('newPos').value.trim(),
                qty: Number(document.getElementById('newQty').value.trim()) || 0,
                site_name: currentSite
            };
            const { error } = await db.from('components').insert([newItem]);
            if (error) { alert('新增失敗：' + error.message); }
            else {
                document.getElementById('newId').value = '';
                document.getElementById('newSpec').value = '';
                document.getElementById('newMaterial').value = '';
                document.getElementById('newWeight').value = '';
                document.getElementById('newPos').value = '';
                document.getElementById('newQty').value = '1';
                closeModal();
                loadItems();
            }
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            filteredItems = allItems.filter(item =>
                (item.item_id || '').toLowerCase().includes(keyword) ||
                (item.spec || '').toLowerCase().includes(keyword) ||
                (item.position || '').toLowerCase().includes(keyword)
            );
            displayedCount = 0;
            renderCards(true);
        });

        function downloadTemplate() {
            const wb = XLSX.utils.book_new();
            const ws_data = [
                ["構件編號", "規格", "材質", "重量", "位置", "數量"],
                ["C1-101", "H-300x150", "SN490B", 150.5, "1F-A區", 1],
                ["B1-201", "H-200x100", "SS400", 85.2, "1F-B區", 2]
            ];
            const ws = XLSX.utils.aoa_to_sheet(ws_data);
            XLSX.utils.book_append_sheet(wb, ws, "構件匯入範例");
            XLSX.writeFile(wb, "構件匯入範例.xlsx");
        }

        async function handleExcelUpload(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet);

                    if (jsonData.length === 0) { alert('Excel 檔案內容為空'); input.value = ''; return; }

                    const mappedData = jsonData.map(row => {
                        const id = row['構件編號'] || row['編號'] || row['Item ID'] || row['item_id'];
                        if (!id) return null;
                        return {
                            item_id: String(id).trim(),
                            spec: (row['構件規格'] || row['規格'] || row['Spec'] || row['spec'] || '').toString().trim(),
                            material: (row['構件材質'] || row['材質'] || row['Material'] || row['material'] || '').toString().trim(),
                            weight: Number(row['構件重量'] || row['重量'] || row['Weight'] || row['weight']) || 0,
                            position: (row['構件位置'] || row['位置'] || row['Position'] || row['position'] || '').toString().trim(),
                            qty: Number(row['構件數量'] || row['數量'] || row['Qty'] || row['qty']) || 0
                        };
                    }).filter(item => item !== null);

                    if (mappedData.length === 0) {
                        alert(`無法識別有效的構件資料。\n\n偵測到的欄位：${Object.keys(jsonData[0]).join(', ')}\n\n請使用「下載範例格式」來確認正確的欄位名稱。`);
                        input.value = '';
                        return;
                    }

                    let successCount = 0, failCount = 0, lastError = "";
                    const currentSite = localStorage.getItem('selectedSite') || '南亞5A';
                    for (let i = 0; i < mappedData.length; i += 100) {
                        const batch = mappedData.slice(i, i + 100).map(item => ({ ...item, site_name: currentSite }));
                        const { error } = await db.from('components').insert(batch);
                        if (error) {
                            console.error('Batch insert error:', error);
                            lastError = error.message;
                            failCount += batch.length;
                        } else {
                            successCount += batch.length;
                        }
                    }

                    let msg = `匯入完成！\n成功：${successCount} 筆\n失敗：${failCount} 筆`;
                    if (failCount > 0 && lastError) msg += `\n\n錯誤訊息：${lastError}`;
                    alert(msg);
                    input.value = '';
                    loadItems();
                } catch (err) {
                    console.error('Excel 解析失敗：' + err.message);
                    input.value = '';
                }
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
    <script src="drawingPreview.js"></script>
    <script src="backToTop.js"></script>
    <!-- Drawing Selection Modal -->
    <div id="drawingSelectionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="drawingSelectionTitle">選擇圖面</div>
                <span class="close-btn" onclick="closeDrawingSelection()">&times;</span>
            </div>
            <div id="drawingSelectionList" style="max-height: 60vh; overflow-y: auto;">
                <!-- Drawing selection items will be inserted here -->
            </div>
        </div>
    </div>


    <!-- Drawing Preview Modal -->
    <div id="drawingModal" class="modal">
        <div class="modal-content" style="max-width: 95%; max-height: 95vh; height: 90vh;">
            <div class="modal-header">
                <div class="modal-title" id="drawingTitle">📋 製造圖預覽</div>
                <span class="close-btn" onclick="closeDrawingModal()">&times;</span>
            </div>
            <div style="height: calc(100% - 80px); overflow: hidden; background: var(--bg); border-radius: 8px;">
                <iframe id="drawingFrame" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
        </div>
    </div>
</body>

</html>
