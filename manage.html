<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>構件管理</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="mobile.css">
    <style>
        body {
            padding: 20px;
            background: var(--bg);
            color: var(--text);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--highlight);
        }

        .back-btn {
            padding: 10px 20px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: #2a2a2a;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #252525;
            color: #fff;
            font-size: 16px;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .sort-select {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #252525;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        .sort-select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .component-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .component-item {
            background: var(--card);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            border: 1px solid var(--border);
        }

        .component-item:hover {
            background: #252b3b;
            border-color: var(--primary);
        }

        .item-info {
            display: flex;
            flex-direction: column;
        }

        .item-id {
            font-size: 18px;
            font-weight: bold;
            color: var(--highlight);
        }

        .item-detail {
            font-size: 14px;
            color: var(--muted);
            margin-top: 4px;
        }

        .item-status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .status-unplanned {
            background: #2f3340;
            color: var(--muted);
            border: 1px solid #444;
        }

        .status-planned {
            background: rgba(195, 164, 14, 0.2);
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .status-received {
            background: rgba(39, 174, 96, 0.2);
            color: var(--ok);
            border: 1px solid var(--ok);
        }

        .status-lifted {
            background: rgba(233, 211, 84, 0.2);
            color: var(--highlight);
            border: 1px solid var(--highlight);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--card);
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }

        .modal-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--highlight);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #252525;
            color: #fff;
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #252525;
            color: #fff;
            box-sizing: border-box;
        }

        .form-select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-save {
            flex: 1;
            padding: 12px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-save:hover {
            background: #d4b520;
        }

        .btn-cancel {
            flex: 1;
            padding: 12px;
            background: #333;
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-cancel:hover {
            background: #444;
        }
    </style>
</head>

<body>
    <div class="header-row">
        <div class="header-title">構件管理</div>
        <a href="SteelMaterial.html" class="back-btn">返回主畫面</a>
    </div>
    <div class="search-bar">
        <input type="text" class="search-input" id="searchInput" placeholder="搜尋構件編號或位置...">
        <select class="sort-select" id="sortSelect">
            <option value="id_asc">編號 (A-Z)</option>
            <option value="id_desc">編號 (Z-A)</option>
            <option value="pos_asc">位置 (A-Z)</option>
            <option value="pos_desc">位置 (Z-A)</option>
            <option value="status_asc">狀態 (未進料 -> 已吊裝)</option>
            <option value="status_desc">狀態 (已吊裝 -> 未進料)</option>
        </select>
    </div>
    <div class="component-list" id="componentList"></div>
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">編輯構件</div>
            <div class="form-group">
                <label class="form-label">構件編號 (Item ID)</label>
                <input type="text" class="form-input" id="editItemId" readonly
                    style="opacity: 0.7; cursor: not-allowed;">
            </div>
            <div class="form-group">
                <label class="form-label">位置 (Position)</label>
                <input type="text" class="form-input" id="editPosition" readonly
                    style="opacity: 0.7; cursor: not-allowed;">
            </div>
            <div class="form-group">
                <label class="form-label">規格 (Spec)</label>
                <input type="text" class="form-input" id="editSpec">
            </div>
            <div class="form-group">
                <label class="form-label">材質 (Material)</label>
                <input type="text" class="form-input" id="editMaterial">
            </div>
            <div class="form-group">
                <label class="form-label">重量 (Weight)</label>
                <input type="number" class="form-input" id="editWeight">
            </div>
            <div class="form-group">
                <label class="form-label">數量 (Qty)</label>
                <input type="number" class="form-input" id="editQty">
            </div>
            <div class="form-group">
                <label class="form-label">狀態 (Status)</label>
                <select class="form-select" id="editStatus">
                    <option value="unplanned">未進料 (Unplanned)</option>
                    <option value="planned">已登記 (Planned)</option>
                    <option value="received">已進料 (Received)</option>
                    <option value="lifted">已吊裝 (Lifted)</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-save" onclick="saveChanges()">儲存變更</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <script src="back.js"></script>
    <script>
        const db = window.supabaseClient;
        let allComponents = [], plannedItems = [], confirmedItems = [], finishedItems = [], currentEditingItem = null;
        let displayedCount = 0;
        const ITEMS_PER_PAGE = 100;
        let currentFiltered = [];

        document.addEventListener("DOMContentLoaded", () => {
            loadData();
            document.getElementById("searchInput").addEventListener("input", () => renderList(true));
            document.getElementById("sortSelect").addEventListener("change", () => renderList(true));

            // Add scroll listener for infinite scroll
            window.addEventListener('scroll', () => {
                const scrollPosition = window.innerHeight + window.scrollY;
                const pageHeight = document.documentElement.scrollHeight;
                if (scrollPosition >= pageHeight - 200) {
                    if (displayedCount < currentFiltered.length) {
                        renderList(false);
                    }
                }
            });
        });

        async function loadData() {
            if (!db) return;
            document.getElementById("componentList").innerHTML = '<div style="text-align:center; padding:20px;">載入中...</div>';
            const currentSite = localStorage.getItem('selectedSite') || '南亞5A';
            const [componentsRes, plannedRes, confirmedRes, finishedRes] = await Promise.all([
                db.from("components").select("*").eq('site_name', currentSite).range(0, 99999),
                db.from("planned").select("*").eq('site_name', currentSite).range(0, 99999),
                db.from("confirm").select("*").eq('site_name', currentSite).range(0, 99999),
                db.from("finished").select("*").eq('site_name', currentSite).range(0, 99999)
            ]);
            allComponents = componentsRes.data || [];
            plannedItems = plannedRes.data || [];
            confirmedItems = confirmedRes.data || [];
            finishedItems = finishedRes.data || [];
            renderList(true);
        }

        function getStatus(item) {
            return finishedItems.some(f => f.item_id === item.item_id && f.position === item.position) ? "lifted" :
                confirmedItems.some(c => c.item_id === item.item_id && c.position === item.position) ? "received" :
                    plannedItems.some(p => p.item_id === item.item_id && p.position === item.position) ? "planned" : "unplanned"
        }

        function getStatusText(status) {
            switch (status) {
                case "lifted": return "已吊裝";
                case "received": return "已進料";
                case "planned": return "已登記";
                default: return "未進料"
            }
        }

        function getStatusWeight(status) {
            switch (status) {
                case "lifted": return 3;
                case "received": return 2;
                case "planned": return 1;
                default: return 0;
            }
        }

        function renderList(reset = false) {
            const filter = document.getElementById("searchInput").value;
            const sort = document.getElementById("sortSelect").value;
            const container = document.getElementById("componentList");

            if (reset) {
                container.innerHTML = "";
                displayedCount = 0;

                // Filter and sort only on reset
                currentFiltered = allComponents.filter(c => (c.item_id || "").toLowerCase().includes(filter.toLowerCase()) || (c.position || "").toLowerCase().includes(filter.toLowerCase()));

                currentFiltered.sort((a, b) => {
                    const statusA = getStatus(a);
                    const statusB = getStatus(b);

                    switch (sort) {
                        case "id_asc": return (a.item_id || "").localeCompare(b.item_id || "");
                        case "id_desc": return (b.item_id || "").localeCompare(a.item_id || "");
                        case "pos_asc": return (a.position || "").localeCompare(b.position || "");
                        case "pos_desc": return (b.position || "").localeCompare(a.position || "");
                        case "status_asc": return getStatusWeight(statusA) - getStatusWeight(statusB);
                        case "status_desc": return getStatusWeight(statusB) - getStatusWeight(statusA);
                        default: return 0;
                    }
                });
            }

            if (currentFiltered.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#777; padding:20px;">找不到符合的構件</div>';
                return;
            }

            const itemsToShow = currentFiltered.slice(displayedCount, displayedCount + ITEMS_PER_PAGE);
            itemsToShow.forEach(item => {
                const status = getStatus(item);
                const div = document.createElement("div");
                div.className = "component-item";
                div.onclick = () => openModal(item);
                div.innerHTML = `<div class="item-info"><div class="item-id">${item.item_id} - ${item.position}</div><div class="item-detail">${item.spec || "-"} | ${item.weight}kg</div></div><div class="item-status status-${status}">${getStatusText(status)}</div>`;
                container.appendChild(div);
            });

            displayedCount += itemsToShow.length;

            // Remove old loading indicator if exists
            const oldLoading = document.getElementById('loadingMsg');
            if (oldLoading) oldLoading.remove();

            // Add loading indicator if more items available
            if (displayedCount < currentFiltered.length) {
                const loadingMsg = document.createElement('div');
                loadingMsg.id = 'loadingMsg';
                loadingMsg.style.textAlign = 'center';
                loadingMsg.style.color = '#aaa';
                loadingMsg.style.padding = '20px';
                loadingMsg.innerText = `滾動載入更多... (${displayedCount}/${currentFiltered.length})`;
                container.appendChild(loadingMsg);
            }
        }

        function openModal(item) {
            currentEditingItem = item;
            const status = getStatus(item);
            document.getElementById("editItemId").value = item.item_id;
            document.getElementById("editPosition").value = item.position;
            document.getElementById("editSpec").value = item.spec || "";
            document.getElementById("editMaterial").value = item.material || "";
            document.getElementById("editWeight").value = item.weight || 0;
            document.getElementById("editQty").value = item.qty || 1;
            document.getElementById("editStatus").value = status;
            document.getElementById("editModal").classList.add("show");
        }

        function closeModal() {
            document.getElementById("editModal").classList.remove("show");
            currentEditingItem = null;
        }

        async function saveChanges() {
            if (!currentEditingItem || !db) return;
            const itemId = document.getElementById("editItemId").value;
            const position = document.getElementById("editPosition").value;
            const newSpec = document.getElementById("editSpec").value;
            const newMaterial = document.getElementById("editMaterial").value;
            const newWeight = document.getElementById("editWeight").value;
            const newQty = document.getElementById("editQty").value;
            const newStatus = document.getElementById("editStatus").value;
            const oldStatus = getStatus(currentEditingItem);

            const btn = document.querySelector(".btn-save");
            const originalText = btn.textContent;
            btn.textContent = "儲存中...";
            btn.disabled = true;

            try {
                const { error: updateError } = await db.from("components").update({ spec: newSpec, material: newMaterial, weight: newWeight, qty: newQty }).eq("item_id", itemId).eq("position", position);
                if (updateError) throw updateError;

                if (newStatus !== oldStatus) {
                    const now = new Date().toISOString();
                    const today = new Date().toISOString().split("T")[0];
                    const getCreatedAt = list => { const existing = list.find(i => i.item_id === itemId && i.position === position); return existing ? existing.created_at : now };
                    const plannedCreatedAt = getCreatedAt(plannedItems);
                    const confirmCreatedAt = getCreatedAt(confirmedItems);
                    const finishedCreatedAt = getCreatedAt(finishedItems);
                    const commonData = { item_id: itemId, position: position, qty: newQty };

                    if ("unplanned" === newStatus) {
                        await Promise.all([
                            db.from("planned").delete().eq("item_id", itemId).eq("position", position),
                            db.from("confirm").delete().eq("item_id", itemId).eq("position", position),
                            db.from("finished").delete().eq("item_id", itemId).eq("position", position)
                        ]);
                    } else if ("planned" === newStatus) {
                        const existingPlanned = plannedItems.find(i => i.item_id === itemId && i.position === position);
                        existingPlanned ? await db.from("planned").update({ qty: newQty, received_at: null }).eq("item_id", itemId).eq("position", position) : await db.from("planned").insert({ ...commonData, planned_date: today, created_at: now, received_at: null });
                        await Promise.all([
                            db.from("confirm").delete().eq("item_id", itemId).eq("position", position),
                            db.from("finished").delete().eq("item_id", itemId).eq("position", position)
                        ]);
                    } else if ("received" === newStatus) {
                        const existingPlanned = plannedItems.find(i => i.item_id === itemId && i.position === position);
                        existingPlanned ? await db.from("planned").upsert({ ...commonData, planned_date: existingPlanned.planned_date || today, created_at: plannedCreatedAt, received_at: now }, { onConflict: "item_id,position" }) : await db.from("planned").upsert({ ...commonData, planned_date: today, created_at: now, received_at: now }, { onConflict: "item_id,position" });
                        await db.from("confirm").upsert({ ...commonData, planned_date: today, created_at: confirmCreatedAt, lifted_at: null }, { onConflict: "item_id,position" });
                        await db.from("finished").delete().eq("item_id", itemId).eq("position", position);
                    } else if ("lifted" === newStatus) {
                        const existingPlanned = plannedItems.find(i => i.item_id === itemId && i.position === position);
                        const existingConfirm = confirmedItems.find(i => i.item_id === itemId && i.position === position);
                        await db.from("planned").upsert({ ...commonData, planned_date: existingPlanned && existingPlanned.planned_date ? existingPlanned.planned_date : today, created_at: existingPlanned ? plannedCreatedAt : now, received_at: existingPlanned && existingPlanned.received_at ? existingPlanned.received_at : now }, { onConflict: "item_id,position" });
                        await db.from("confirm").upsert({ ...commonData, planned_date: existingConfirm && existingConfirm.planned_date ? existingConfirm.planned_date : today, created_at: existingConfirm ? confirmCreatedAt : now, lifted_at: now }, { onConflict: "item_id,position" });
                        await db.from("finished").upsert({ ...commonData, planned_date: today, confirmed_date: today, created_at: finishedCreatedAt }, { onConflict: "item_id,position" });
                    }
                }
                alert("儲存成功！");
                closeModal();
                loadData();
            } catch (err) {
                console.error("Save error:", err);
                alert("儲存失敗：" + err.message);
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }
    </script>
    <script src="backToTop.js"></script>
</body>

</html>
